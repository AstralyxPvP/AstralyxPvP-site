<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>News Portal — AstralyxPvP</title>
<link rel="icon" href="https://astralyxpvp.pages.dev/favicon.ico">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<style>
/* ── Reset & tokens ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:          #0d1117;
  --surface:     #161b22;
  --surface2:    #21262d;
  --border:      #30363d;
  --text:        #c9d1d9;
  --text-bright: #f0f6fc;
  --text-muted:  #8b949e;
  --red:         #C8102E;
  --red-hover:   #a30f25;
  --red-subtle:  rgba(200,16,46,0.12);
  --red-border:  rgba(200,16,46,0.35);
  --gold:        #d4a017;
  --link:        #58a6ff;
  --green:       #3fb950;
  --font:        -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --mono:        'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  --radius:      6px;
  --shadow:      0 8px 24px rgba(0,0,0,0.4);
}
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: var(--font); cursor: pointer; }
input, textarea, select { font-family: var(--font); }

/* ── Header ─────────────────────────────────────────────────── */
.gh-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.gh-header-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 16px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.gh-logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 15px;
  color: var(--text-bright);
  text-decoration: none;
}
.gh-logo-icon {
  width: 28px; height: 28px;
  background: var(--red);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  color: #fff;
  font-weight: 900;
  flex-shrink: 0;
}
.gh-logo span { font-size: 13px; color: var(--text-muted); font-weight: 400; }
.gh-spacer { flex: 1; }
.gh-back {
  font-size: 12px;
  color: var(--text-muted);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  border-radius: var(--radius);
  transition: background 0.15s;
}
.gh-back:hover { background: var(--surface2); color: var(--text); text-decoration: none; }
.gh-user {
  display: flex;
  align-items: center;
  gap: 8px;
}
.gh-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
}
.gh-username { font-size: 13px; font-weight: 600; color: var(--text-bright); }
.gh-badge {
  font-size: 10px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 20px;
  background: var(--red-subtle);
  border: 1px solid var(--red-border);
  color: var(--red);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

/* ── Buttons ─────────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  border: 1px solid transparent;
  transition: all 0.15s;
  cursor: pointer;
  white-space: nowrap;
}
.btn-primary {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
}
.btn-primary:hover { background: var(--red-hover); border-color: var(--red-hover); }
.btn-secondary {
  background: var(--surface2);
  color: var(--text);
  border-color: var(--border);
}
.btn-secondary:hover { background: #2d333b; border-color: #8b949e; }
.btn-ghost {
  background: transparent;
  color: var(--text-muted);
  border-color: var(--border);
}
.btn-ghost:hover { background: var(--surface2); color: var(--text); }
.btn-danger {
  background: transparent;
  color: #f85149;
  border-color: rgba(248,81,73,0.3);
}
.btn-danger:hover { background: rgba(248,81,73,0.1); }
.btn-sm { padding: 3px 10px; font-size: 12px; }
.btn-discord {
  background: #5865f2;
  color: #fff;
  border-color: #5865f2;
  gap: 8px;
}
.btn-discord:hover { background: #4752c4; border-color: #4752c4; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── Layout ─────────────────────────────────────────────────── */
.main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 24px 16px 80px;
}

/* ── Page title bar ──────────────────────────────────────────── */
.page-title-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.page-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--text-bright);
  flex: 1;
}
.post-count {
  font-size: 12px;
  color: var(--text-muted);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px 8px;
}

/* ── Filter bar ──────────────────────────────────────────────── */
.filter-bar {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  align-items: center;
}
.tag-pill {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
}
.tag-pill:hover { border-color: var(--red-border); color: var(--text); }
.tag-pill.active {
  background: var(--red-subtle);
  border-color: var(--red-border);
  color: var(--red);
  font-weight: 600;
}

/* ── Posts grid ──────────────────────────────────────────────── */
.posts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}

/* ── Post card ───────────────────────────────────────────────── */
.post-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  display: flex;
  flex-direction: column;
  gap: 10px;
  position: relative;
  overflow: hidden;
}
.post-card:hover {
  border-color: var(--red-border);
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  transform: translateY(-2px);
}
.post-card.pinned { border-color: rgba(212,160,23,0.35); }
.post-card.pinned::before {
  content: '📌 Pinned';
  position: absolute;
  top: 0; right: 0;
  font-size: 10px;
  font-weight: 700;
  color: var(--gold);
  background: rgba(212,160,23,0.1);
  padding: 3px 8px;
  border-bottom-left-radius: var(--radius);
}
.card-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-bright);
  line-height: 1.3;
  padding-right: 56px;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}
.card-avatar {
  width: 24px; height: 24px;
  border-radius: 50%;
  border: 1px solid var(--border);
  object-fit: cover;
  flex-shrink: 0;
}
.card-author { font-size: 12px; font-weight: 600; color: var(--text); }
.card-date { font-size: 11px; color: var(--text-muted); }
.card-thumb {
  width: 100%;
  max-height: 140px;
  object-fit: cover;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.card-preview {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.5;
  max-height: 60px;
  overflow: hidden;
  position: relative;
}
.card-preview::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 28px;
  background: linear-gradient(transparent, var(--surface));
}
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}
.card-tags { display: flex; gap: 4px; flex-wrap: wrap; }
.tag {
  font-size: 11px;
  padding: 1px 7px;
  border-radius: 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text-muted);
}
.card-read { font-size: 12px; color: var(--red); font-weight: 600; }

/* ── Empty / loading state ───────────────────────────────────── */
.state-box {
  grid-column: 1/-1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.state-box .icon { font-size: 40px; margin-bottom: 12px; }
.state-box p { font-size: 14px; }

/* ── Read Modal ──────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 500;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 32px 16px;
  overflow-y: auto;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 100%;
  max-width: 740px;
  position: relative;
  overflow: hidden;
}
.modal-top-bar {
  height: 3px;
  background: linear-gradient(90deg, var(--red), #ff6b6b, var(--red));
  background-size: 200%;
  animation: bar-shimmer 3s linear infinite;
}
@keyframes bar-shimmer { to { background-position: 200% 0; } }

.modal-inner { padding: 24px; }
.modal-close {
  position: absolute;
  top: 12px; right: 14px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-muted);
  font-size: 16px;
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  z-index: 10;
}
.modal-close:hover { border-color: var(--red-border); color: var(--text); }

.modal-pin { font-size: 11px; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
.modal-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-bright);
  line-height: 1.25;
  margin-bottom: 16px;
}
.modal-meta {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  margin-bottom: 24px;
}
.modal-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  object-fit: cover;
}
.modal-author { font-size: 13px; font-weight: 700; color: var(--text-bright); }
.modal-date { font-size: 12px; color: var(--text-muted); }
.modal-staff-actions {
  display: flex;
  gap: 6px;
  margin-left: auto;
}

/* ── Markdown render ─────────────────────────────────────────── */
.md-body { font-size: 14px; color: var(--text); line-height: 1.75; }
.md-body h1 { font-size: 22px; color: var(--text-bright); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin: 24px 0 14px; }
.md-body h2 { font-size: 18px; color: var(--text-bright); border-bottom: 1px solid var(--border); padding-bottom: 6px; margin: 20px 0 12px; }
.md-body h3 { font-size: 16px; color: var(--text-bright); margin: 16px 0 8px; }
.md-body p { margin: 10px 0; }
.md-body strong { color: var(--text-bright); font-weight: 700; }
.md-body em { color: var(--text-muted); }
.md-body a { color: var(--link); }
.md-body a:hover { text-decoration: underline; }
.md-body code {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  font-family: var(--mono);
  font-size: 12px;
  color: #e6c07b;
}
.md-body pre {
  background: #010409;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  margin: 14px 0;
}
.md-body pre code { background: none; border: none; padding: 0; color: #e6edf3; font-size: 13px; }
.md-body blockquote {
  border-left: 3px solid var(--red);
  padding: 4px 0 4px 14px;
  margin: 14px 0;
  color: var(--text-muted);
}
.md-body ul, .md-body ol { padding-left: 22px; margin: 10px 0; }
.md-body li { margin: 4px 0; }
.md-body table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px; }
.md-body th { background: var(--surface2); color: var(--text-bright); padding: 8px 12px; text-align: left; border: 1px solid var(--border); }
.md-body td { padding: 7px 12px; border: 1px solid var(--border); color: var(--text-muted); }
.md-body tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
.md-body img { max-width: 100%; border-radius: 6px; margin: 12px 0; border: 1px solid var(--border); }
.md-body hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

.modal-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
  margin-top: 16px;
}
.modal-gallery img {
  width: 100%;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  cursor: zoom-in;
}
.modal-tags {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.modal-edited { font-size: 11px; color: var(--text-muted); margin-top: 12px; font-style: italic; }

/* ── Editor Panel ────────────────────────────────────────────── */
.editor-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 600;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 32px 16px;
  overflow-y: auto;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.editor-overlay.open { opacity: 1; pointer-events: auto; }
.editor-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 100%;
  max-width: 820px;
  overflow: hidden;
}
.editor-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.editor-header h2 { font-size: 15px; font-weight: 700; color: var(--text-bright); flex: 1; }
.editor-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

.field-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
  display: block;
}
.field-label .req { color: var(--red); }
.field-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

.gh-input {
  width: 100%;
  padding: 8px 12px;
  background: #010409;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-bright);
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
}
.gh-input:focus { border-color: var(--link); box-shadow: 0 0 0 3px rgba(88,166,255,0.1); }
.gh-input::placeholder { color: var(--text-muted); }

.gh-textarea {
  width: 100%;
  min-height: 280px;
  padding: 12px;
  background: #010409;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-bright);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  resize: vertical;
  outline: none;
  transition: border-color 0.15s;
}
.gh-textarea:focus { border-color: var(--link); box-shadow: 0 0 0 3px rgba(88,166,255,0.1); }

/* Editor tabs */
.editor-tabs {
  display: flex;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  width: fit-content;
  margin-bottom: 8px;
}
.editor-tab {
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 600;
  border: none;
  background: var(--surface2);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
}
.editor-tab:not(:last-child) { border-right: 1px solid var(--border); }
.editor-tab.active { background: var(--surface); color: var(--text-bright); }

#editorPreview {
  min-height: 280px;
  padding: 12px;
  background: #010409;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: none;
  overflow: auto;
}

/* Images list */
.img-inputs { display: flex; flex-direction: column; gap: 6px; }
.img-row { display: flex; gap: 6px; }
.img-row input {
  flex: 1;
  padding: 6px 10px;
  background: #010409;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.img-row input:focus { border-color: var(--link); }

/* Tags */
.tags-input-row { display: flex; gap: 6px; }
.tags-input-row input {
  flex: 1;
  padding: 6px 10px;
  background: #010409;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  outline: none;
}
.tags-input-row input:focus { border-color: var(--link); }
.tags-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  padding: 2px 8px;
  border-radius: 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
}
.tag-chip button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 13px; line-height: 1; padding: 0; }
.tag-chip button:hover { color: #f85149; }

/* Pin toggle */
.toggle-row { display: flex; align-items: center; gap: 10px; }
.toggle { position: relative; width: 40px; height: 22px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0;
  background: var(--border);
  border-radius: 22px;
  cursor: pointer;
  transition: 0.2s;
}
.toggle-slider::before {
  content: '';
  position: absolute;
  height: 16px; width: 16px;
  left: 3px; top: 3px;
  background: #fff;
  border-radius: 50%;
  transition: 0.2s;
}
input:checked + .toggle-slider { background: var(--red); }
input:checked + .toggle-slider::before { transform: translateX(18px); }
.toggle-label { font-size: 13px; color: var(--text); }

.editor-footer {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 14px 20px;
  border-top: 1px solid var(--border);
  background: var(--surface2);
  flex-wrap: wrap;
}
.editor-status {
  font-size: 12px;
  flex: 1;
}
.editor-status.ok { color: var(--green); }
.editor-status.err { color: #f85149; }

/* ── Login CTA ───────────────────────────────────────────────── */
.login-cta {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
  text-align: center;
  margin-bottom: 24px;
  display: none;
}
.login-cta h3 { font-size: 15px; color: var(--text-bright); margin-bottom: 6px; }
.login-cta p { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }

/* ── Error banner ────────────────────────────────────────────── */
.error-banner {
  background: rgba(248,81,73,0.1);
  border: 1px solid rgba(248,81,73,0.3);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 13px;
  color: #f85149;
  margin-bottom: 16px;
  display: none;
}

/* ── FAB (new post) ──────────────────────────────────────────── */
.fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 200;
  display: none;
}
.fab button {
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: 24px;
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  box-shadow: 0 4px 20px rgba(200,16,46,0.4);
  transition: all 0.2s;
}
.fab button:hover { background: var(--red-hover); transform: translateY(-2px); box-shadow: 0 8px 28px rgba(200,16,46,0.5); }

/* ── Divider row ─────────────────────────────────────────────── */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 540px) { .two-col { grid-template-columns: 1fr; } }

@media (max-width: 600px) {
  .posts-grid { grid-template-columns: 1fr; }
  .modal-gallery { grid-template-columns: 1fr 1fr; }
  .page-title-bar { flex-direction: column; align-items: flex-start; gap: 8px; }
}

/* scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #484f58; }
</style>
</head>
<body>

<!-- ── HEADER ──────────────────────────────────────────────────── -->
<header class="gh-header">
  <div class="gh-header-inner">
    <a class="gh-logo" href="/news.html">
      <div class="gh-logo-icon">A</div>
      AstralyxPvP <span>/ News</span>
    </a>
    <div class="gh-spacer"></div>
    <a class="gh-back" href="/announcements.html">← Announcements</a>
    <div id="headerAuth"></div>
  </div>
</header>

<!-- ── MAIN ────────────────────────────────────────────────────── -->
<main class="main">

  <!-- Error banner -->
  <div class="error-banner" id="errorBanner"></div>

  <!-- Page title -->
  <div class="page-title-bar">
    <h1 class="page-title">📰 News Portal</h1>
    <span class="post-count" id="postCount">Loading…</span>
  </div>

  <!-- Staff login CTA (shown when not logged in) -->
  <div class="login-cta" id="loginCta">
    <h3>🛡️ Staff? Post an announcement</h3>
    <p>Log in with Discord to verify your staff role and create posts.</p>
    <button class="btn btn-discord" onclick="loginWithDiscord()">
      <svg width="18" height="14" viewBox="0 0 71 55" fill="white"><path d="M60.1 4.9A58.5 58.5 0 0 0 45.5.4a41 41 0 0 0-1.8 3.7 54 54 0 0 0-16.4 0A41 41 0 0 0 25.5.4 58.6 58.6 0 0 0 10.9 5C1.6 18.8-1 32.3.3 45.6a59 59 0 0 0 18 9.1 44 44 0 0 0 3.8-6.2l-.1-.1a38.6 38.6 0 0 1-6-2.9l1.5-1.1a42.1 42.1 0 0 0 36 0l1.5 1.1a38.5 38.5 0 0 1-6 2.9 43.8 43.8 0 0 0 3.8 6.2 58.7 58.7 0 0 0 18-9.1C72 30.2 68 16.9 60.1 4.9ZM23.7 37.8c-3.5 0-6.4-3.2-6.4-7.2s2.9-7.2 6.4-7.2 6.5 3.2 6.4 7.2c0 4-2.9 7.2-6.4 7.2Zm23.6 0c-3.5 0-6.4-3.2-6.4-7.2s2.9-7.2 6.4-7.2 6.5 3.2 6.4 7.2c0 4-2.9 7.2-6.4 7.2Z"/></svg>
      Login with Discord
    </button>
  </div>

  <!-- Filter bar -->
  <div class="filter-bar" id="filterBar" style="display:none">
    <button class="tag-pill active" onclick="filterTag(null,this)">All</button>
  </div>

  <!-- Posts grid -->
  <div class="posts-grid" id="postsGrid">
    <div class="state-box"><div class="icon">⏳</div><p>Loading posts…</p></div>
  </div>

</main>

<!-- ── FAB ─────────────────────────────────────────────────────── -->
<div class="fab" id="fab">
  <button onclick="openEditor()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    New Post
  </button>
</div>

<!-- ── READ MODAL ──────────────────────────────────────────────── -->
<div class="modal-overlay" id="readModal" onclick="closeRead(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-top-bar"></div>
    <div class="modal-inner" id="readInner"></div>
  </div>
</div>

<!-- ── EDITOR MODAL ────────────────────────────────────────────── -->
<div class="editor-overlay" id="editorOverlay" onclick="closeEditor(event)">
  <div class="editor-box" onclick="event.stopPropagation()">
    <div class="editor-header">
      <h2 id="editorTitle">New Post</h2>
      <button class="btn btn-ghost btn-sm" onclick="closeEditor()">✕ Close</button>
    </div>
    <div class="editor-body">

      <div>
        <label class="field-label">Title <span class="req">*</span></label>
        <input class="gh-input" id="eTitle" type="text" placeholder="Post title…" maxlength="200">
      </div>

      <div>
        <label class="field-label">Content <span class="req">*</span> <span style="text-transform:none;font-weight:400;">— Full Markdown supported</span></label>
        <div class="editor-tabs">
          <button class="editor-tab active" onclick="edTab('write',this)">✏️ Write</button>
          <button class="editor-tab" onclick="edTab('preview',this)">👁 Preview</button>
        </div>
        <textarea class="gh-textarea" id="eContent" placeholder="# Heading&#10;&#10;Write your post here...&#10;**bold** *italic* `code`&#10;- bullet lists&#10;| Tables | Supported |&#10;![img](url)" oninput="livePreview()"></textarea>
        <div class="md-body" id="editorPreview"></div>
        <p class="field-hint">Tip: paste image URLs as <code>![alt](url)</code> inline or add to the gallery below.</p>
      </div>

      <div>
        <label class="field-label">Image Gallery URLs</label>
        <div class="img-inputs" id="imgInputs"></div>
        <button class="btn btn-ghost btn-sm" style="margin-top:6px" onclick="addImgField()">+ Add image URL</button>
      </div>

      <div>
        <label class="field-label">Tags</label>
        <div class="tags-chips" id="tagsChips"></div>
        <div class="tags-input-row" style="margin-top:6px">
          <input type="text" id="tagInput" placeholder="Updates, Events, Maintenance…" maxlength="30"
            onkeydown="if(event.key==='Enter'||event.key===','){event.preventDefault();addTag();}">
          <button class="btn btn-ghost btn-sm" onclick="addTag()">Add</button>
        </div>
      </div>

      <div>
        <div class="toggle-row">
          <label class="toggle">
            <input type="checkbox" id="ePinned">
            <span class="toggle-slider"></span>
          </label>
          <span class="toggle-label">📌 Pin to top</span>
        </div>
      </div>

    </div>
    <div class="editor-footer">
      <span class="editor-status" id="edStatus"></span>
      <button class="btn btn-ghost btn-sm" id="eCancelEdit" style="display:none" onclick="resetEditor()">Cancel edit</button>
      <button class="btn btn-primary" id="eSubmit" onclick="submitPost()">
        Publish Post
      </button>
    </div>
  </div>
</div>

<!-- ── SCRIPTS ─────────────────────────────────────────────────── -->
<script>
/* ════════════════════════════════════════════════════════════════
   CONFIG — update DISCORD_CLIENT_ID to match your Discord app
════════════════════════════════════════════════════════════════ */
const DISCORD_CLIENT_ID = '1528677016939921428'; // ← replace this

/* ════════════════════════════════════════════════════════════════
   AUTH — JWT stored in sessionStorage, server verified on writes
════════════════════════════════════════════════════════════════ */
let SESSION = null; // { token, userId, username, avatar, isStaff }

function initAuth() {
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const error = params.get('error');

  // Clean URL immediately — don't leave JWT in browser history
  if (token || error) {
    history.replaceState({}, '', location.pathname);
  }

  if (error) {
    const msgs = {
      not_staff:   '🚫 You are not a staff member on AstralyxPvP.',
      token_failed:'⚠️ Discord auth failed. Try again.',
      user_failed: '⚠️ Could not fetch your Discord profile.',
      no_code:     '⚠️ OAuth code missing.',
      server_error:'⚠️ Server error during login.',
      no_jwt_secret:'⚠️ JWT_SECRET not configured on server.',
    };
    showError(msgs[error] || `Login error: ${error}`);
  }

  if (token) {
    sessionStorage.setItem('np_token', token);
  }

  const stored = sessionStorage.getItem('np_token');
  if (stored) {
    // Decode JWT payload client-side for UI only (server verifies on writes)
    try {
      const payload = JSON.parse(atob(stored.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      const now = Math.floor(Date.now() / 1000);
      if (payload.exp && payload.exp > now && payload.isStaff) {
        SESSION = { token: stored, ...payload };
      } else {
        sessionStorage.removeItem('np_token'); // expired
      }
    } catch { sessionStorage.removeItem('np_token'); }
  }

  renderHeader();
}

function renderHeader() {
  const el = document.getElementById('headerAuth');
  if (SESSION) {
    el.innerHTML = `
      <div class="gh-user">
        <img class="gh-avatar" src="${esc(SESSION.avatar)}" alt="" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
        <span class="gh-username">${esc(SESSION.username)}</span>
        <span class="gh-badge">Staff</span>
        <button class="btn btn-ghost btn-sm" onclick="logout()">Sign out</button>
      </div>`;
    document.getElementById('fab').style.display = '';
    document.getElementById('loginCta').style.display = 'none';
  } else {
    el.innerHTML = `<button class="btn btn-discord btn-sm" onclick="loginWithDiscord()">
      Login with Discord
    </button>`;
    document.getElementById('loginCta').style.display = 'block';
  }
}

function loginWithDiscord() {
  const state = crypto.randomUUID();
  sessionStorage.setItem('oauth_state', state);
  const redirect = encodeURIComponent(`${location.origin}/discord-callback`);
  const url = `https://discord.com/oauth2/authorize?client_id=${DISCORD_CLIENT_ID}&redirect_uri=${redirect}&response_type=code&scope=identify+guilds.members.read&state=${state}`;
  location.href = url;
}

function logout() {
  sessionStorage.removeItem('np_token');
  SESSION = null;
  renderHeader();
}

/* ════════════════════════════════════════════════════════════════
   POSTS — fetch, render, filter
════════════════════════════════════════════════════════════════ */
let posts = [];
let activeTag = null;

async function loadPosts() {
  const grid = document.getElementById('postsGrid');
  try {
    const res = await fetch('/news-api');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    posts = await res.json();
    document.getElementById('postCount').textContent = `${posts.length} post${posts.length !== 1 ? 's' : ''}`;
    buildFilters();
    renderGrid();
  } catch (e) {
    grid.innerHTML = `<div class="state-box"><div class="icon">⚠️</div><p>${esc(e.message)}</p></div>`;
  }
}

function buildFilters() {
  const allTags = new Set();
  posts.forEach(p => (p.tags||[]).forEach(t => allTags.add(t)));
  if (!allTags.size) return;
  const bar = document.getElementById('filterBar');
  bar.style.display = 'flex';
  allTags.forEach(t => {
    const b = document.createElement('button');
    b.className = 'tag-pill';
    b.textContent = t;
    b.onclick = () => filterTag(t, b);
    bar.appendChild(b);
  });
}

function filterTag(tag, btn) {
  activeTag = tag;
  document.querySelectorAll('.tag-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGrid();
}

function renderGrid() {
  const grid = document.getElementById('postsGrid');
  const filtered = activeTag ? posts.filter(p => (p.tags||[]).includes(activeTag)) : posts;
  if (!filtered.length) {
    grid.innerHTML = `<div class="state-box"><div class="icon">📭</div><p>No posts yet.</p></div>`;
    return;
  }
  grid.innerHTML = '';
  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'post-card' + (p.pinned ? ' pinned' : '');
    card.onclick = () => openRead(p.id);
    const thumb = (p.images||[])[0];
    card.innerHTML = `
      <div class="card-title">${esc(p.title)}</div>
      <div class="card-meta">
        <img class="card-avatar" src="${esc(p.author_avatar||'')}" alt=""
          onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
        <span class="card-author">${esc(p.author_name)}</span>
        <span class="card-date">· ${relTime(p.created_at)}</span>
      </div>
      ${thumb ? `<img class="card-thumb" src="${esc(thumb)}" alt="" loading="lazy">` : ''}
      <div class="card-preview">${esc(textPreview(p.content))}</div>
      <div class="card-footer">
        <div class="card-tags">${(p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
        <span class="card-read">Read →</span>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* ════════════════════════════════════════════════════════════════
   READ MODAL
════════════════════════════════════════════════════════════════ */
function openRead(id) {
  const p = posts.find(x => x.id === id);
  if (!p) return;
  marked.setOptions({ breaks: true, gfm: true });
  const html = DOMPurify.sanitize(marked.parse(p.content));
  const gallery = (p.images||[]).length
    ? `<div class="modal-gallery">${(p.images||[]).map(u=>`<img src="${esc(u)}" alt="" loading="lazy">`).join('')}</div>`
    : '';
  const tags = (p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  const staffBtns = SESSION ? `
    <div class="modal-staff-actions">
      <button class="btn btn-ghost btn-sm" onclick="startEdit(${id});closeRead()">✏️ Edit</button>
      <button class="btn btn-danger btn-sm" onclick="deletePost(${id})">🗑 Delete</button>
    </div>` : '';

  document.getElementById('readInner').innerHTML = `
    ${p.pinned ? '<div class="modal-pin">📌 Pinned Announcement</div>' : ''}
    <h1 class="modal-title">${esc(p.title)}</h1>
    <div class="modal-meta">
      <img class="modal-avatar" src="${esc(p.author_avatar||'')}" alt=""
        onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
      <div>
        <div class="modal-author">${esc(p.author_name)}</div>
        <div class="modal-date">${new Date(p.created_at+'Z').toLocaleString([], {dateStyle:'long',timeStyle:'short'})}</div>
      </div>
      ${staffBtns}
    </div>
    <div class="md-body">${html}</div>
    ${gallery}
    ${tags ? `<div class="modal-tags">${tags}</div>` : ''}
    ${p.edited_at ? `<p class="modal-edited">Edited ${relTime(p.edited_at)}</p>` : ''}
    <div style="height:8px"></div>
    <button class="btn btn-ghost btn-sm" onclick="closeRead()">← Close</button>
  `;
  document.getElementById('readModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeRead(e) {
  if (!e || e.target.id === 'readModal') {
    document.getElementById('readModal').classList.remove('open');
    document.body.style.overflow = '';
  }
}

/* ════════════════════════════════════════════════════════════════
   EDITOR
════════════════════════════════════════════════════════════════ */
let editingId = null;
let edTags = [];

function openEditor() {
  if (!SESSION) return;
  document.getElementById('editorOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeEditor(e) {
  if (!e || e.target.id === 'editorOverlay') {
    document.getElementById('editorOverlay').classList.remove('open');
    document.body.style.overflow = '';
  }
}

function edTab(tab, btn) {
  document.querySelectorAll('.editor-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const ta = document.getElementById('eContent');
  const pv = document.getElementById('editorPreview');
  if (tab === 'preview') { ta.style.display = 'none'; pv.style.display = 'block'; livePreview(); }
  else { ta.style.display = ''; pv.style.display = 'none'; }
}

function livePreview() {
  marked.setOptions({ breaks: true, gfm: true });
  document.getElementById('editorPreview').innerHTML =
    DOMPurify.sanitize(marked.parse(document.getElementById('eContent').value));
}

function addImgField(url = '') {
  const row = document.createElement('div');
  row.className = 'img-row';
  row.innerHTML = `<input type="url" placeholder="https://…" value="${esc(url)}">
    <button class="btn btn-danger btn-sm" onclick="this.closest('.img-row').remove()">✕</button>`;
  document.getElementById('imgInputs').appendChild(row);
}

function getImages() {
  return [...document.querySelectorAll('#imgInputs .img-row input')]
    .map(i => i.value.trim()).filter(Boolean);
}

function addTag() {
  const inp = document.getElementById('tagInput');
  const val = inp.value.replace(/,/g,'').trim();
  if (val && !edTags.includes(val) && edTags.length < 8) { edTags.push(val); renderChips(); }
  inp.value = '';
}

function removeTag(i) { edTags.splice(i,1); renderChips(); }

function renderChips() {
  document.getElementById('tagsChips').innerHTML = edTags.map((t,i)=>
    `<span class="tag-chip">${esc(t)}<button onclick="removeTag(${i})">×</button></span>`
  ).join('');
}

function resetEditor() {
  editingId = null;
  edTags = [];
  document.getElementById('eTitle').value = '';
  document.getElementById('eContent').value = '';
  document.getElementById('ePinned').checked = false;
  document.getElementById('imgInputs').innerHTML = '';
  document.getElementById('tagsChips').innerHTML = '';
  document.getElementById('editorPreview').innerHTML = '';
  document.getElementById('editorTitle').textContent = 'New Post';
  document.getElementById('eSubmit').textContent = 'Publish Post';
  document.getElementById('eCancelEdit').style.display = 'none';
  document.getElementById('edStatus').textContent = '';
}

function startEdit(id) {
  const p = posts.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  edTags = [...(p.tags||[])];
  document.getElementById('eTitle').value = p.title;
  document.getElementById('eContent').value = p.content;
  document.getElementById('ePinned').checked = p.pinned;
  document.getElementById('imgInputs').innerHTML = '';
  (p.images||[]).forEach(u => addImgField(u));
  renderChips();
  document.getElementById('editorTitle').textContent = 'Edit Post';
  document.getElementById('eSubmit').textContent = 'Save Changes';
  document.getElementById('eCancelEdit').style.display = '';
  openEditor();
}

async function submitPost() {
  if (!SESSION) return;
  const title = document.getElementById('eTitle').value.trim();
  const content = document.getElementById('eContent').value.trim();
  if (!title) return edErr('Title is required.');
  if (!content) return edErr('Content is required.');

  const btn = document.getElementById('eSubmit');
  btn.disabled = true;
  btn.textContent = 'Publishing…';

  const body = {
    title, content,
    images: getImages(),
    tags: edTags,
    pinned: document.getElementById('ePinned').checked,
  };

  const url = editingId ? `/news-api?id=${editingId}` : '/news-api';
  const method = editingId ? 'PATCH' : 'POST';

  try {
    const res = await fetch(url, {
      method,
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${SESSION.token}`,
      },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Unknown error');
    edOk(editingId ? '✅ Post updated!' : '✅ Post published!');
    resetEditor();
    closeEditor();
    await loadPosts();
  } catch (e) {
    edErr(`❌ ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = editingId ? 'Save Changes' : 'Publish Post';
  }
}

async function deletePost(id) {
  const p = posts.find(x => x.id === id);
  if (!confirm(`Delete "${p?.title}"?\n\nThis cannot be undone.`)) return;
  try {
    const res = await fetch(`/news-api?id=${id}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${SESSION.token}` },
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    closeRead();
    await loadPosts();
  } catch (e) {
    alert(`Delete failed: ${e.message}`);
  }
}

function edErr(msg) {
  const s = document.getElementById('edStatus');
  s.className = 'editor-status err';
  s.textContent = msg;
}
function edOk(msg) {
  const s = document.getElementById('edStatus');
  s.className = 'editor-status ok';
  s.textContent = msg;
  setTimeout(() => { s.textContent = ''; }, 4000);
}

/* ════════════════════════════════════════════════════════════════
   UTILS
════════════════════════════════════════════════════════════════ */
function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.textContent = msg;
  el.style.display = 'block';
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function relTime(d) {
  const diff = Date.now() - new Date(d+'Z').getTime();
  const s = Math.floor(diff/1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s/60); if (m < 60) return `${m}m ago`;
  const h = Math.floor(m/60); if (h < 24) return `${h}h ago`;
  const dy = Math.floor(h/24); if (dy < 7) return `${dy}d ago`;
  return new Date(d+'Z').toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});
}

function textPreview(md, n=180) {
  const s = md.replace(/#{1,6}\s+/g,'').replace(/\*\*(.+?)\*\*/g,'$1')
    .replace(/\*(.+?)\*/g,'$1').replace(/`{1,3}[^`]*`{1,3}/g,'')
    .replace(/!\[.*?\]\(.*?\)/g,'').replace(/\[(.+?)\]\(.+?\)/g,'$1')
    .replace(/>\s*/g,'').replace(/[-*+]\s/g,'').replace(/\n+/g,' ').trim();
  return s.length > n ? s.slice(0,n)+'…' : s;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeRead(); closeEditor(); }
});

/* ════════════════════════════════════════════════════════════════
   INIT
════════════════════════════════════════════════════════════════ */
initAuth();
loadPosts();
</script>
</body>
</html>
