  <style>
    .status-section {
      padding: 80px 9%;
      min-height: 60vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .status-container {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 60px 40px;
      backdrop-filter: blur(10px);
      max-width: 720px;
      width: 100%;
      animation: fadeInUp 0.8s ease-out forwards;
    }

    .status-main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: start;
    }

    .status-left {
      text-align: left;
    }

    .status-badge {
      font-size: 2.8rem;
      margin-bottom: 16px;
      animation: pulse 2s ease-in-out infinite;
    }

    .status-badge i {
      filter: drop-shadow(0 0 12px currentColor);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .status-title {
      font-family: var(--font-elegant);
      font-size: 2.2rem;
      color: var(--accent);
      margin: 0 0 12px;
      text-transform: uppercase;
    }

    .status-message {
      font-size: 1.2rem;
      color: var(--text);
      margin: 0;
      font-weight: 700;
    }

    .status-right {
      text-align: left;
    }

    .status-details {
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.8;
      margin: 0;
    }

    .online { color: #00ff44; }
    .offline { color: var(--primary); }
    .maintenance { color: var(--accent); }

    .status-info {
      background: rgba(200, 16, 46, 0.1);
      border-left: 3px solid var(--primary);
      padding: 20px;
      margin-top: 28px;
      border-radius: 8px;
      text-align: left;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .info-row:last-child { margin-bottom: 0; }

    .info-label { color: var(--muted); }

    .info-value {
      color: var(--text);
      font-weight: 700;
    }

    .pulse-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulseDot 1.5s ease-in-out infinite;
    }

    .pulse-dot.online {
      background: #00ff44;
      box-shadow: 0 0 10px #00ff44;
    }

    .pulse-dot.offline {
      background: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    .pulse-dot.maintenance {
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    @keyframes pulseDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-discord {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
      padding: 14px 28px;
      border-radius: 999px;
      background: linear-gradient(135deg, #5865F2, #4752C4);
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.9rem;
      letter-spacing: 0.06em;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 20px rgba(88, 101, 242, 0.4);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
    }

    .status-discord:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 30px rgba(88, 101, 242, 0.5);
    }

    @media (max-width: 660px) {
      .status-main {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .status-left { text-align: center; }
      .status-badge { margin-bottom: 10px; }
    }
  </style>
</head>
<body class="page-enter">

  <div>

    <a href="/rules"><i class="fa-solid fa-scroll"></i>View rules</a>
  </div>
  <div class="page-content">
    <section class="status-section">
      <div class="status-container">
        <div class="status-main">
          <div class="status-left">
            <div class="status-badge" id="status-badge"><i class="fa-solid fa-circle" style="color:#c8102e;"></i></div>
            <h1 class="status-title">Server Status</h1>
            <p class="status-message" id="status-message">Loading...</p>
          </div>
          <div class="status-right">
            <p class="status-details" id="status-details">Checking server status...</p>
          </div>
        </div>
        <div class="status-info" id="status-info" style="display: none;">
          <div class="info-row">
            <span class="info-label">Status:</span>
            <span class="info-value"><span class="pulse-dot" id="pulse-indicator"></span><span id="status-indicator">Unknown</span></span>
          </div>
          <div class="info-row" id="maintenance-row" style="display: none;">
            <span class="info-label">Maintenance Expected End:</span>
            <span class="info-value" id="maintenance-info">N/A</span>
          </div>
          <div class="info-row" id="players-row" style="display: none;">
            <span class="info-label">Players Online:</span>
            <span class="info-value" id="players-info">N/A</span>
          </div>
        </div>
        <a href="https://discord.gg/u8BFrpRwEg" target="_blank" rel="noopener" class="status-discord">
          <i class="fa-brands fa-discord"></i> Check Announcements & Updates
        </a>
      </div>
    </section>
  </div>

  <script>
    // ======== STATUS PAGE - SERVER STATUS LOADER ========
    const API_BASE = "https://astralyxpvpweb.pages.dev/api/";
    const yamlData = {
      'maintainence': 'yes',
      'maintainence-expected-end': '2026-06-22'
    };

    async function loadServerStatus() {
      const statusMessage = document.getElementById('status-message');
      const statusDetails = document.getElementById('status-details');
      const statusBadge = document.getElementById('status-badge');
      const statusInfo = document.getElementById('status-info');
      const statusIndicator = document.getElementById('status-indicator');
      const pulseIndicator = document.getElementById('pulse-indicator');
      const maintenanceRow = document.getElementById('maintenance-row');
      const maintenanceInfo = document.getElementById('maintenance-info');
      const playersRow = document.getElementById('players-row');
      const playersInfo = document.getElementById('players-info');

      function setBadge(icon, color) {
        statusBadge.innerHTML = '<i class="fa-solid fa-' + icon + '" style="color:' + color + ';"></i>';
      }

      try {
        const isMaintenance = (yamlData['maintainence'] || '').toLowerCase() === 'yes';
        const expectedEndRaw = (yamlData['maintainence-expected-end'] || '').trim();

        statusInfo.style.display = 'block';

        if (isMaintenance) {
          // Server is in maintenance mode
          setBadge('wrench', '#ffb142');
          statusMessage.textContent = 'Server in Maintenance';
          statusMessage.className = 'status-message maintenance';
          statusDetails.innerHTML = `Server is currently undergoing maintenance to improve your gaming experience.`;
          statusIndicator.textContent = 'MAINTENANCE MODE';
          pulseIndicator.className = 'pulse-dot maintenance';
          maintenanceRow.style.display = 'flex';
          if (!expectedEndRaw) {
            maintenanceInfo.textContent = `We don't have an estimate right now`;
          } else {
            // Format the date nicely (e.g., "22nd June 2026")
            var parts = expectedEndRaw.split('-');
            var d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
            var day = d.getDate();
            var suffix = 'th';
            if (day === 1 || day === 21 || day === 31) suffix = 'st';
            else if (day === 2 || day === 22) suffix = 'nd';
            else if (day === 3 || day === 23) suffix = 'rd';
            var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            maintenanceInfo.textContent = day + suffix + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
          }
        } else {
          // Server is not in maintenance, check if online
          try {
            const apiResponse = await fetch(`${API_BASE}?serverStatus=true`);
            const apiData = await apiResponse.json();

            if (apiData.online) {
              setBadge('circle', '#00ff44');
              statusMessage.textContent = 'Server Online';
              statusMessage.className = 'status-message online';
              statusDetails.innerHTML = `The server is running and ready for battle! <strong>${apiData.current}/${apiData.max}</strong> players are currently online. Jump in and start playing.`;
              statusIndicator.textContent = 'ONLINE';
              pulseIndicator.className = 'pulse-dot online';
              playersRow.style.display = 'flex';
              playersInfo.textContent = `${apiData.current}/${apiData.max} Players`;
            } else {
              setBadge('circle', '#c8102e');
              statusMessage.textContent = 'Server Offline';
              statusMessage.className = 'status-message offline';
              statusDetails.innerHTML = `The server is currently offline. Please check back soon!`;
              statusIndicator.textContent = 'OFFLINE';
              pulseIndicator.className = 'pulse-dot offline';
              playersRow.style.display = 'none';
            }
          } catch (error) {
            console.error('API error:', error);
            setBadge('circle', '#00ff44');
            statusMessage.textContent = 'Server Online';
            statusMessage.className = 'status-message online';
            statusDetails.innerHTML = `The server is running. Players are currently online. Jump in and start playing.`;
            statusIndicator.textContent = 'ONLINE';
            pulseIndicator.className = 'pulse-dot online';
            playersRow.style.display = 'flex';
            playersInfo.textContent = 'Players Online';
          }
        }
      } catch (error) {
        console.error('Error loading server status:', error);
        setBadge('circle', '#00ff44');
        statusMessage.textContent = 'Server Online';
        statusMessage.className = 'status-message online';
        statusDetails.innerHTML = `The server is running and ready for battle! Jump in and start playing.`;
        statusIndicator.textContent = 'ONLINE';
        pulseIndicator.className = 'pulse-dot online';
        statusInfo.style.display = 'block';
      }
    }

    // Load status on page load
    document.addEventListener('DOMContentLoaded', loadServerStatus);
    
    // Refresh every 30 seconds
    setInterval(loadServerStatus, 30000);
  </script>
