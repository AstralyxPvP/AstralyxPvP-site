  <style>
    .announcements-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .turnstile-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    /* Discord Timestamp Styling */
    .discord-timestamp {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: 500;
      font-size: 0.9em;
      color: #dcddde;
      cursor: help;
      display: inline-block;
    }
    .discord-timestamp:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    .forum-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (max-width: 768px) {
      .forum-grid { grid-template-columns: 1fr; }
    }

    .announcement-card {
      background: #1e1f22;
      border-radius: 8px;
      padding: 18px;
      border: 1px solid #2b2d31;
      color: #dcddde;
      font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .announcement-card:hover {
      border-color: #5865f2;
      transform: translateY(-2px);
    }
    .announcement-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: #2b2d31;
    }
    .user-info { display: flex; flex-direction: column; }
    .username-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .username { font-weight: 700; font-size: 0.95rem; }
    .badge-role {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(88, 101, 242, 0.2);
      color: #5865f2;
      font-weight: 600;
      text-transform: uppercase;
    }
    .timestamp { font-size: 0.72rem; color: #949ba4; margin-top: 2px; }
    .announcement-body {
      font-size: 0.92rem;
      line-height: 1.45;
      max-height: 110px;
      overflow: hidden;
      position: relative;
      word-break: break-word;
      white-space: pre-wrap;
      flex-grow: 1;
    }
    .announcement-body.truncated::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 40px;
      background: linear-gradient(transparent, #1e1f22);
    }
    .read-more-tag { color: #5865f2; font-weight: 600; font-size: 0.8rem; margin-top: 10px; display: inline-block; }
    .media-preview img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 6px;
      margin-top: 10px;
      object-fit: cover;
    }

    /* Discord Markdown Rules */
    .discord-h1 { font-size: 1.45em; font-weight: bold; margin: 12px 0 6px; color: #fff; border-bottom: 1px solid #35363c; padding-bottom: 4px; }
    .discord-h2 { font-size: 1.28em; font-weight: bold; margin: 10px 0 5px; color: #fff; }
    .discord-h3 { font-size: 1.12em; font-weight: bold; margin: 8px 0 4px; color: #fff; }
    .discord-bold { font-weight: bold; }
    .discord-italic { font-style: italic; }
    .discord-underline { text-decoration: underline; }
    .discord-strike { text-decoration: line-through; }
    .discord-code { background: #2b2d31; padding: 2px 4px; border-radius: 4px; font-family: monospace; }
    .discord-link { color: #00a8fc; text-decoration: none; }
    .discord-link:hover { text-decoration: underline; }

    /* Mention Bubbles */
    .mention-bubble {
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.85em;
      display: inline-block;
      margin: 0 1px;
      text-decoration: none;
    }
    .mention-channel, .mention-user { background: rgba(88, 101, 242, 0.15); color: #c9cdfb; }
    .mention-everyone { background: rgba(240, 71, 71, 0.15); color: #f04747; }

    /* Discord Message Link Pill Styling */
    .discord-msg-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #2b2d38;
      color: #c9cdfb;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: 600;
      text-decoration: none;
      vertical-align: middle;
      margin: 0 2px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .discord-msg-link:hover {
      background: #363947;
      color: #ffffff;
    }
    .discord-msg-link .link-chevron {
      color: #949ba4;
      font-weight: 400;
      margin: 0 1px;
    }
    .discord-msg-link svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      flex-shrink: 0;
    }
    .discord-msg-link .bubble-icon {
      color: #8a9cf8;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: #313338;
      border-radius: 8px;
      width: 90%; max-width: 700px; max-height: 85vh;
      overflow-y: auto; padding: 24px; color: #dbdee1;
      position: relative;
    }
    .modal-close {
      position: absolute; top: 14px; right: 18px;
      background: none; border: none;
      color: #b5bac1; font-size: 1.5rem; cursor: pointer;
    }
  </style>

  <script>
    async function loadHead() {
      try {
        const response = await fetch('Assets/head.html');
        const text = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        const newNodes = Array.from(doc.head.childNodes);
        for (const node of newNodes) {
          if (node.tagName === 'SCRIPT') {
            const script = document.createElement('script');
            Array.from(node.attributes).forEach(attr => script.setAttribute(attr.name, attr.value));
            script.textContent = node.textContent;
            document.head.appendChild(script);
          } else {
            document.head.appendChild(node);
          }
        }
      } catch (err) {
        console.error('Failed to load head:', err);
      }
    }
    loadHead();
  </script>
</head>

<body>

<script src="Script/script.js"></script>

<script>
  let announcementsData = {};
  let activeSessionToken = null;

  // Explicitly attach callback to window object before Turnstile calls it
  window.onTurnstileSuccess = function(token) {
    loadAnnouncements(token);
  };

  function formatDiscordTimestamp(unixSec, style = 'f') {
    const timestamp = Number(unixSec) * 1000;
    const date = new Date(timestamp);
    
    if (isNaN(date.getTime())) return `<t:${unixSec}:${style}>`;

    const fullTooltip = date.toLocaleString([], {
      weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });

    let formattedText = '';

    switch (style) {
      case 't':
        formattedText = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        break;
      case 'T':
        formattedText = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        break;
      case 'd':
        formattedText = date.toLocaleDateString([], { month: '2-digit', day: '2-digit', year: 'numeric' });
        break;
      case 'D':
        formattedText = date.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' });
        break;
      case 'f':
        formattedText = `${date.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' })} ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        break;
      case 'F':
        formattedText = `${date.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })} ${date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        break;
      case 'R':
        formattedText = getRelativeTimeString(date);
        break;
      default:
        formattedText = date.toLocaleString();
    }

    return `<span class="discord-timestamp" title="${fullTooltip}">${formattedText}</span>`;
  }

  function getRelativeTimeString(date) {
    const diffInSeconds = Math.floor((date.getTime() - Date.now()) / 1000);
    const rtf = new Intl.RelativeTimeFormat('en', { numeric: 'auto' });

    const cutoffs = [60, 3600, 86400, 86400 * 7, 86400 * 30, 86400 * 365, Infinity];
    const units = ['second', 'minute', 'hour', 'day', 'week', 'month', 'year'];

    let unitIndex = 0;
    let absDiff = Math.abs(diffInSeconds);

    if (absDiff < 5) return 'just now';

    while (absDiff >= cutoffs[unitIndex]) {
      unitIndex++;
    }

    const divisor = unitIndex === 0 ? 1 : cutoffs[unitIndex - 1];
    const value = Math.round(diffInSeconds / divisor);

    return rtf.format(value, units[unitIndex]);
  }

  const SVG_BULLHORN = `<svg viewBox="0 0 24 24"><path d="M3.5 10c-.83 0-1.5.67-1.5 1.5v1c0 .83.67 1.5 1.5 1.5H5l4 3.5V6.5L5 10H3.5zm12.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>`;
  const SVG_HASHTAG = `<svg viewBox="0 0 24 24"><path d="M5.886 21 7.05 14.5H2l.363-2h5.051l1.103-6H3.466l.363-2h5.152l1.163-6h2.099l-1.163 6h6.077l1.163-6h2.099l-1.163 6H24l-.363 2h-5.051l-1.103 6h5.051l-.363 2h-5.152l-1.163 6h-2.099l1.163-6H8.892l-1.163 6H5.886Zm5.312-8.5h6.077l1.103-6h-6.077l-1.103 6Z"/></svg>`;
  const SVG_THREAD = `<svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 3.18-9 7.1 0 2.14 1.22 4.05 3.12 5.34-.23.82-.82 2.15-2.12 3.18 0 0 2.22.18 4.41-1.32.12.02.24.03.37.03 4.97 0 9-3.18 9-7.1S16.97 3 12 3z"/></svg>`;
  const SVG_BUBBLE = `<svg class="bubble-icon" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.141 2 11.25c0 2.44 1.033 4.654 2.73 6.27-.406 1.488-1.554 3.16-1.572 3.185a.5.5 0 0 0 .548.78c2.47-.643 4.542-1.851 5.61-2.541A10.87 10.87 0 0 0 12 20.5c5.523 0 10-4.141 10-9.25S17.523 2 12 2z"/></svg>`;

  function parseDiscordFormatting(content, mentions = {}) {
    let html = content || "";

    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer" class="discord-link">$1</a>');

    const msgLinkRegex = /https:\/\/(?:canary\.|ptb\.)?discord\.com\/channels\/(?:\d+|@me)\/(\d+)\/(\d+)/g;
    html = html.replace(msgLinkRegex, (match, channelId) => {
      const channel = mentions.channels ? mentions.channels.find(c => c.id === channelId) : null;

      if (channel && channel.isThread) {
        return `<a href="${match}" target="_blank" rel="noopener noreferrer" class="discord-msg-link">
          ${SVG_THREAD}
          <span>${channel.parentName || 'channel'}</span>
          <span class="link-chevron">›</span>
          ${SVG_BUBBLE}
          <span>${channel.name}</span>
        </a>`;
      } else if (channel) {
        const icon = channel.type === 5 ? SVG_BULLHORN : SVG_HASHTAG;
        return `<a href="${match}" target="_blank" rel="noopener noreferrer" class="discord-msg-link">
          ${icon}
          <span>${channel.name}</span>
          <span class="link-chevron">›</span>
          ${SVG_BUBBLE}
        </a>`;
      } else {
        return `<a href="${match}" target="_blank" rel="noopener noreferrer" class="discord-msg-link">
          ${SVG_HASHTAG}
          <span>channel</span>
          <span class="link-chevron">›</span>
          ${SVG_BUBBLE}
        </a>`;
      }
    });

    html = html.replace(/<t:(-?\d+)(?::([tTdDfFR]))?>/g, (match, timestamp, style) => {
      return formatDiscordTimestamp(timestamp, style || 'f');
    });

    html = html.replace(/@everyone/g, `<span class="mention-bubble mention-everyone">@everyone</span>`);
    html = html.replace(/@here/g, `<span class="mention-bubble mention-everyone">@here</span>`);

    if (mentions.channels) {
      mentions.channels.forEach(ch => {
        const regex = new RegExp(`<#${ch.id}>`, 'g');
        html = html.replace(regex, `<span class="mention-bubble mention-channel">#${ch.name}</span>`);
      });
    }

    if (mentions.users) {
      mentions.users.forEach(u => {
        const regex = new RegExp(`<@!?${u.id}>`, 'g');
        html = html.replace(regex, `<span class="mention-bubble mention-user" style="color:${u.color}">@${u.displayName}</span>`);
      });
    }

    if (mentions.roles) {
      mentions.roles.forEach(r => {
        const regex = new RegExp(`<@&${r.id}>`, 'g');
        const bg = r.color ? `${r.color}22` : 'rgba(88,101,242,0.15)';
        html = html.replace(regex, `<span class="mention-bubble" style="background:${bg}; color:${r.color}">@${r.name}</span>`);
      });
    }

    html = html.replace(/^### (.*$)/gim, '<div class="discord-h3">$1</div>');
    html = html.replace(/^## (.*$)/gim, '<div class="discord-h2">$1</div>');
    html = html.replace(/^# (.*$)/gim, '<div class="discord-h1">$1</div>');

    html = html.replace(/\*\*(.*?)\*\*/g, '<span class="discord-bold">$1</span>');
    html = html.replace(/\*(.*?)\*/g, '<span class="discord-italic">$1</span>');
    html = html.replace(/__(.*?)__/g, '<span class="discord-underline">$1</span>');
    html = html.replace(/~~(.*?)~~/g, '<span class="discord-strike">$1</span>');
    html = html.replace(/`(.*?)`/g, '<code class="discord-code">$1</code>');

    return html;
  }

  async function loadAnnouncements(explicitTurnstileToken = null) {
    const feed = document.getElementById('announcements-feed');
    const wrapper = document.getElementById('turnstileWrapper');

    // Use URL Search Parameters instead of custom headers to prevent CORS issues
    const params = new URLSearchParams({ channelId: '1477033205017346259' });

    if (activeSessionToken) {
      params.set('sessionToken', activeSessionToken);
    } else {
      const token = explicitTurnstileToken || (typeof turnstile !== 'undefined' ? turnstile.getResponse() : null);
      if (!token) {
        feed.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Please complete the security check above.</p>';
        return;
      }
      params.set('turnstileToken', token);
    }

    try {
      const res = await fetch(`/annoucments?${params.toString()}`);
      const payload = await res.json();

      if (!res.ok) {
        throw new Error(payload.error || `Server returned error status ${res.status}`);
      }

      // Hide CAPTCHA widget once verification succeeds
      if (wrapper) wrapper.style.display = 'none';

      if (payload.sessionToken) {
        activeSessionToken = payload.sessionToken;
      }

      announcementsData = payload.announcements || {};
      feed.innerHTML = '';

      const messageKeys = Object.keys(announcementsData);
      if (messageKeys.length === 0) {
        feed.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">No announcements found.</p>';
        return;
      }

      messageKeys.forEach(id => {
        const msg = announcementsData[id];
        const formattedDate = new Date(msg.timestamp).toLocaleString();
        const parsedBody = parseDiscordFormatting(msg.content, msg.mentions);
        const isLongText = msg.content.length > 150 || (msg.content.match(/\n/g) || []).length > 2;

        const card = document.createElement('div');
        card.className = 'announcement-card';
        card.onclick = () => openModal(id);

        card.innerHTML = `
          <div class="announcement-header">
            <img class="avatar" src="${msg.user.avatarUrl}" alt="${msg.user.displayName}" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'">
            <div class="user-info">
              <div class="username-row">
                <span class="username">${msg.user.displayName}</span>
                <span class="badge-role">${msg.highestRank}</span>
              </div>
              <span class="timestamp">${formattedDate}</span>
            </div>
          </div>
          <div class="announcement-body ${isLongText ? 'truncated' : ''}">${parsedBody}</div>
          ${isLongText ? '<span class="read-more-tag">Click to read full announcement →</span>' : ''}
          ${msg.pictures.length > 0 ? `<div class="media-preview"><img src="${msg.pictures[0]}" /></div>` : ''}
        `;
        feed.appendChild(card);
      });
    } catch (err) {
      feed.innerHTML = `<p style="color:#ff4d6d; text-align:center; grid-column: 1/-1;">Error: ${err.message}</p>`;
    }
  }

  function openModal(id) {
    const msg = announcementsData[id];
    if (!msg) return;

    const modalBody = document.getElementById('modalBody');
    const parsedBody = parseDiscordFormatting(msg.content, msg.mentions);

    modalBody.innerHTML = `
      <div class="announcement-header">
        <img class="avatar" src="${msg.user.avatarUrl}" alt="${msg.user.displayName}">
        <div class="user-info">
          <div class="username-row">
            <span class="username">${msg.user.displayName}</span>
            <span class="badge-role">${msg.highestRank}</span>
          </div>
          <span class="timestamp">${new Date(msg.timestamp).toLocaleString()}</span>
        </div>
      </div>
      <div style="white-space: pre-wrap; line-height: 1.5; margin-top: 15px;">${parsedBody}</div>
      ${msg.pictures.map(pic => `<div style="margin-top:15px"><img src="${pic}" style="max-width:100%; border-radius:6px;"/></div>`).join('')}
    `;

    document.getElementById('announcementModal').classList.add('active');
  }

  function closeModal(e) {
    if (!e || e.target.id === 'announcementModal' || e.target.classList.contains('modal-close')) {
      document.getElementById('announcementModal').classList.remove('active');
    }
  }
</script>
</body>
