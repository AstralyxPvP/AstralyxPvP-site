name: Validate Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run validation tests
        run: npm test

      - name: Check JS syntax
        run: |
          echo "Checking JavaScript syntax..."
          for f in Script/script.js; do
            node --check "$f" && echo "  OK: $f" || exit 1
          done
          for f in astralyxai.html; do
            # Extract script contents between <script> and </script> (excluding src=)
            echo "  Checking inline scripts in $f..."
            node -e "
              const fs = require('fs');
              const html = fs.readFileSync('$f', 'utf-8');
              const blocks = html.match(/<script>([\s\S]*?)<\/script>/g) || [];
              blocks.forEach((b, i) => {
                const code = b.replace(/<\/?script>/g, '');
                try {
                  new Function(code);
                } catch(e) {
                  console.error('  Script block ' + (i+1) + ' has syntax error: ' + e.message);
                  process.exit(1);
                }
              });
              console.log('  OK: all inline scripts in $f');
            "
          done

      - name: AI Integration Tests
        run: node tests/ai-test.js
        timeout-minutes: 2

      - name: Scan for broken internal links
        run: |
          echo "Checking internal links..."
          node -e "
            const fs = require('fs');
            const path = require('path');
            const htmlFiles = fs.readdirSync('.').filter(f => f.endsWith('.html'));
            let failed = false;
            htmlFiles.forEach(file => {
              if (file === 'head-data.html') return;
              const content = fs.readFileSync(file, 'utf-8');
              const links = content.match(/href=[\"']([^\"']+)[\"']/g) || [];
              links.forEach(link => {
                const href = link.match(/[\"']([^\"']+)[\"']/)[1];
                if (href.startsWith('/') && !href.startsWith('//') &&
                    !href.includes('discord') && !href.startsWith('/api') && !href.startsWith('/chat')) {
                  const clean = href.replace(/^\//, '');
                  const asHtml = clean.endsWith('.html') ? clean : clean + '.html';
                  const asIndex = path.join(clean, 'index.html');
                  if (!fs.existsSync(path.join('.', clean)) &&
                      !fs.existsSync(path.join('.', asHtml)) &&
                      !fs.existsSync(asIndex)) {
                    console.error('  BROKEN: ' + file + ' -> ' + href);
                    failed = true;
                  }
                }
              });
            });
            if (failed) process.exit(1);
            console.log('  OK: no broken internal links');
          "
