<!--Gentile modern layout for AstralyxAI -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="kYWtU-P7VA6R31WMyTMMOKQ2ZHby0qlITXmdnE-xNZA" />
  <meta name="google-site-verification" content="dwWOJSf9PK5NvguaxcjVUYJCZK2Ehc_ZpdgavYEGgcs" />
  <meta name="google-site-verification" content="5x4oetuwUCYoInPARiV5ebPUEToLUzxiI1MfjvNc128" />
  <link rel="canonical" href="https://astralyxpvp.pages.dev" />
  <title>AstralyxAI - Chat</title>
  <meta name="description" content="Chat with AstralyxAI - Your personal assistant for AstralyxPvP server information, rules, and support." />
  <meta name="keywords" content="AstralyxAI, chat, assistant, Minecraft, PvP, support" />
  <meta name="author" content="Frostrax (Owner), IndianCoder3 &amp; DreamLong (NebulaGames Developers)" />
  <link rel="stylesheet" href="Style/style.css">
  
  <style>
    /* Gemini-Inspired Red Theme Variables */
    :root {
      --bg-gradient: radial-gradient(circle at 50% 30%, #250407 0%, #0c0203 60%, #000000 100%);
      --primary-red: #c8102e;
      --primary-glow: rgba(200, 16, 46, 0.25);
      --glass-bg: rgba(18, 12, 13, 0.7);
      --glass-border: rgba(200, 16, 46, 0.2);
      --text-main: #f5f5f7;
      --text-muted: #9e9eaf;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body.chat-page {
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Header Bar */
    .chat-header {
      background: rgba(10, 5, 6, 0.6);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .chat-header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #ff4d6d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Messages Main Container */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 40px 20px 120px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    /* Gemini-Style Centered Hero Welcome Screen */
    .welcome-message {
      text-align: center;
      margin: auto 0;
      padding: 40px 20px;
      animation: fadeIn 0.8s ease;
    }

    .welcome-message h2 {
      font-size: 2.8rem;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 30%, #ff334b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-message p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Sleek Message Layouts */
    .message {
      display: flex;
      flex-direction: column;
      animation: messageSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 85%;
    }

    .message.user {
      align-self: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
    }

    /* Sender labels like Gemini */
    .message-sender {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    
    .message.user .message-sender {
      text-align: right;
      color: #ff4d6d;
    }

    .message-content {
      padding: 14px 20px;
      border-radius: 18px;
      font-size: 1rem;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.assistant .message-content {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border-top-left-radius: 4px;
    }

    .message.user .message-content {
      background: linear-gradient(135deg, var(--primary-red) 0%, #900418 100%);
      color: #ffffff;
      border-top-right-radius: 4px;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    .message-content a {
      color: #ff4d6d;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px dashed rgba(255, 77, 109, 0.4);
    }

    .message-content a:hover {
      color: #ff758f;
      border-bottom-style: solid;
    }

    /* Floating Pill Input Box Area */
    .chat-input-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 760px;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 10;
    }

    .chat-input-area {
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 8px 8px 8px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .chat-input-area:focus-within {
      border-color: rgba(200, 16, 46, 0.6);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px var(--primary-glow);
    }

    .chat-input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 10px 0;
      font-family: inherit;
      font-size: 1.05rem;
      resize: none;
      max-height: 120px;
      outline: none;
    }

    /* Clean Rounded Send Button */
    .send-btn {
      background: #ffffff;
      border: none;
      color: #000000;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background-color 0.2s;
    }

    .send-btn:hover {
      background: #ff4d6d;
      color: #ffffff;
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.3;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    .model-indicator {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 10px;
      letter-spacing: 0.3px;
    }

    /* Modern Minimalist Typing Indicator */
    .typing-indicator {
      display: flex;
      gap: 6px;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 16px;
      width: fit-content;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff4d6d;
      animation: typing 1.4s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-6px); opacity: 1; }
    }

    @keyframes messageSlideIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .error-message {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid #e74c3c;
      color: #e74c3c;
      padding: 12px 16px;
      border-radius: 12px;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
  </style>
</head>

<body class="page-enter chat-page">

  <div id="navbar-placeholder"></div>

  <div class="chat-header">
    <h1>AstralyxAI</h1>
    <div id="modelStatus" style="font-size: 0.8rem; color: var(--text-muted);">Gemini 3.1 Flash Lite</div>
  </div>

  <main class="chat-messages" id="chatMessages">
    <div class="welcome-message">
      <h2>Welcome to AstralyxAI</h2>
      <p>Your elite companion for AstralyxPvP. Ask me anything about server rules, leaderboards, voting rewards, or applications.</p>
    </div>
  </main>

  <div class="chat-input-container">
    <form class="chat-input-area" onsubmit="event.preventDefault();sendMessage();">
      <div class="chat-input-wrapper">
        <textarea 
          id="chatInput" 
          class="chat-input" 
          placeholder="Ask AstralyxAI..." 
          rows="1"
          onkeydown="handleKeyPress(event)"
        ></textarea>
      </div>
      <button class="send-btn" id="sendBtn" type="submit">➔</button>
    </form>
    <div class="model-indicator">
      <span>AstralyxAI can make mistakes. Verify critical server rules on Discord.</span>
    </div>
  </div>

  <script>
    // AstralyxAI Configuration
    const SYSTEM_PROMPT = `You are AstralyxAI 1.0, an elite, respectful AI assistant for the AstralyxPvP Minecraft server. You are knowledgeable, helpful, and always direct. You are made by IndianCoder3.

SERVER INFORMATION:
- Name: AstralyxPvP
- Type: India-based 1.9+ FFA PvP Server
- IP: none-subscribe.gl.joinmc.link
- Status: Skill-based ELO system with live leaderboards
- Free & Cracked: Yes, everyone is welcome
- Features: Custom ELO tracking, crates, skill-based battles

KEY PAGES & LINKS:
- [Main Website](https://astralyxpvp.pages.dev/)
- [Rules](https://astralyxpvp.pages.dev/rules)
- [Staff Application](https://astralyxpvp.pages.dev/apply)
- [Leaderboard](https://astralyxpvp.pages.dev/leaderboard)
- [Vote](https://astralyxpvp.pages.dev/vote)
- [Store](https://astralyxpvp.pages.dev/store)
- [Status](https://astralyxpvp.pages.dev/status)
- [Discord](https://discord.gg/u8BFrpRwEg)

RULES SUMMARY:
- No hacked clients, macros, autoclickers, or x-ray
- No exploits, glitches, dupes, or anti-cheat bypasses
- No boosting, win-trading, stat manipulation, or cross-teaming
- No hate speech, harassment, doxxing, or impersonation
- No fraudulent payments or chargebacks
- Ban evasion on alts = permanent IP ban
- Staff have final say in disputes

STAFF REQUIREMENTS:
- Conduct: Respectful, no harassment, stay calm
- Activity: 5+ hours per week in-game & Discord
- Responsibility: Secure account, no leaks, report bugs
- Apply through Discord #staff-application channel

VOTING:
- Vote daily on Minecraft-Server-List, TopG, and Minecraft-MP
- Claim rewards in-game after voting
- Report non-registering votes to staff on Discord

STORE & PAYMENTS:
- AstralyxPlus rank available
- YouTube rank available (free for content creators)
- All purchases final - refunds via support tickets
- Items arrive within 15 minutes

CRITICAL RESPONSE RULES:
1. ONLY answer the specific question asked. Never dump irrelevant links.
2. If greeted (hi, hello, etc), greet back casually and ask how you can help.
3. Use clean Markdown links only: [Text](https://url.com)
4. For staff applications: Direct to [Apply Here](https://astralyxpvp.pages.dev/apply)
5. For technical issues: Suggest contacting staff on Discord
6. For announcements: Direct to Discord #announcements
7. Keep responses concise, friendly, and professional
8. Never make up information about the server
9. Always be respectful and helpful
10. If unsure about something, admit it and direct to Discord support`;

    const MODELS = {
        primary: 'gemini-3.1-flash-lite',
        fallback: 'gemini-2.5-flash-lite'
    };

    let currentModel = MODELS.primary;
    let conversationHistory = [];
    
    let settings = {
      apiKey: 'AIzaSyCYoY3ctFRd6UmsrVuABYLzG361-wNZagU', // <-- PUT YOUR API KEY HERE
      temperature: 1.0
    };

    function addMessage(content, isUser = false) {
      const messagesDiv = document.getElementById('chatMessages');

      const welcome = messagesDiv.querySelector('.welcome-message');
      if (welcome) welcome.remove();

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

      const senderLabel = document.createElement('div');
      senderLabel.className = 'message-sender';
      senderLabel.textContent = isUser ? 'You' : 'AstralyxAI';

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.innerHTML = content;

      messageDiv.appendChild(senderLabel);
      messageDiv.appendChild(contentDiv);
      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTyping() {
      const messagesDiv = document.getElementById('chatMessages');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message assistant';
      typingDiv.innerHTML = `
        <div class="message-sender">AstralyxAI</div>
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      typingDiv.id = 'typingIndicator';
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById('typingIndicator');
      if (typing) typing.remove();
    }

    async function callGeminiAPI(messages) {
      if (!settings.apiKey || settings.apiKey === 'YOUR_GEMINI_API_KEY') {
        throw new Error('API key not set. Please edit the HTML file and update your Gemini API key configuration.');
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${settings.apiKey}`;

      const payload = {
        contents: messages.map(msg => ({
          role: msg.role === 'user' ? 'user' : 'model',
          parts: [{ text: msg.content }]
        })),
        generationConfig: {
          temperature: settings.temperature
        }
      };

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error?.message || 'API Error');
      }

      const data = await response.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();

      if (!message) return;

      // FIX: This now only alerts you if the key is completely missing or blank
      if (!settings.apiKey || settings.apiKey === '' || settings.apiKey === 'YOUR_GEMINI_API_KEY') {
        addMessage('<div class="error-message">API key not set. Please edit the HTML file and update your Gemini API key configuration.</div>', false);
        return;
      }

      addMessage(message, true);
      input.value = '';
      input.style.height = 'auto';
  
  // ... the rest of your code stays exactly the same!
      document.getElementById('sendBtn').disabled = true;
      showTyping();

      try {
        conversationHistory.push({ role: 'user', content: message });

        const messages = [
          { role: 'user', content: SYSTEM_PROMPT },
          { role: 'model', content: 'I understand. I am AstralyxAI, your assistant for AstralyxPvP.' },
          ...conversationHistory
        ];

        let response;
        try {
        response = await callGeminiAPI(messages);
        currentModel = MODELS.primary;
        document.getElementById('modelStatus').textContent = 'Gemini 3.1 Flash Lite';
        } catch (primaryError) {
        console.log('Primary model failed, switching to fallback');
        currentModel = MODELS.fallback;
        document.getElementById('modelStatus').textContent = 'Gemini 2.5 Flash Lite';
        response = await callGeminiAPI(messages);
        }

        const formattedResponse = response
          .replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
          .replace(/\n/g, '<br>');

        removeTyping();
        addMessage(formattedResponse, false);
        conversationHistory.push({ role: 'assistant', content: response });

      } catch (error) {
        removeTyping();
        addMessage(`<div class="error-message">Error: ${error.message}</div>`, false);
        console.error('API Error:', error);
      } {
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
      const textarea = event.target;
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }
  </script>
</body>
</html>
