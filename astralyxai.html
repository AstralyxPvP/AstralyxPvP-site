        displayed += chars[i];
        textBody.innerHTML = parseMarkdown(displayed);
        if (i % 2 === 0) {
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        const delay = chars[i].match(/[.!?]\s*$/) ? 60 : 12;
        await new Promise(r => setTimeout(r, delay));
      }

      const speakBtn = document.createElement('button');
      speakBtn.innerHTML = '<i class="fas fas fa-volume-up"></i>';
      speakBtn.style.background = 'transparent';
      speakBtn.style.border = 'none';
      speakBtn.style.color = 'var(--text-muted)';
      speakBtn.style.cursor = 'pointer';
      speakBtn.style.fontSize = '1.1rem';
      speakBtn.style.display = 'block';
      speakBtn.style.marginTop = '10px';
      speakBtn.onclick = () => speakText(textBody.innerText);
      contentDiv.appendChild(speakBtn);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTyping() {
      const messagesDiv = document.getElementById('chatMessages');
      if(document.getElementById('typingIndicator')) return;
      
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message assistant';
      typingDiv.innerHTML = `
        <div class="message-sender">AstralyxAI</div>
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      typingDiv.id = 'typingIndicator';
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById('typingIndicator');
      if (typing) typing.remove();
    }

    const FunctionRegistry = {
      async fetchLeaderboard(args) {
        const gamemode = args.gamemode || "swordffa1";
        const response = await fetch(`${API_BASE}?leaderboard=${encodeURIComponent(gamemode)}`);
        if (!response.ok) throw new Error("Leaderboard API error");
        const data = await response.json();
        if (Array.isArray(data) && data.length > 0) {
          const elements = data.slice(0, 5).map((p, index) => `#${index + 1} ${p.username} (${p.elo} ELO)`).join(", ");
          return `[LIVE LEADERBOARD DATA FOR ${gamemode}: ${elements}]`;
        }
        return `[LIVE LEADERBOARD DATA FOR ${gamemode}: No records found]`;
      },

      async fetchServerStatus() {
        const response = await fetch(`${API_BASE}?serverStatus=true`);
        if (!response.ok) throw new Error("Status API error");
        const data = await response.json();
        return `[LIVE STATUS DATA: Online=${data.online}, Current Players=${data.current || 0}, Max Limit=${data.max || 100}]`;
      }
    };

    // Add 'token' inside the parentheses here!
    

    async function callGeminiAPI(messages, token) {
      const url = `/chat`; // Matches your file structure
      const payload = { 
          messages: messages, 
          model: currentModel,
          turnstileToken: token,
          sessionToken: activeSessionToken 
      };

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json(); // Now it will work because backend is fixed
      if (data.sessionToken) activeSessionToken = data.sessionToken;
      
      return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    }
    const parseMarkdown = (text) => {
      if (!text) return '';
      if (typeof marked !== 'undefined' && marked.parse) {
        return marked.parse(text, { breaks: true, gfm: true });
      }
      // Fallback if marked CDN fails to load
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`(.+?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
    };
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message) return;
      
      let token = null;
      // ONLY ask Turnstile if no active session exists
      if (!activeSessionToken) {
        token = turnstile.getResponse();
        if (!token) {
          alert("Please verify you are human.");
          return;
        }
      }
      const userMsgId = generateId();
      renderOrUpdateMessage(userMsgId, message, true);
      
      input.value = '';
      input.style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;
      showTyping();

      const aiMsgId = generateId();
      conversationHistory.push({ role: 'user', content: message });

      try {
        let messagesPayload = [
          { role: 'user', content: SYSTEM_PROMPT },
          { role: 'model', content: '<thinking>System parameters configured. Ready to accept clean tool requests via internal JSON protocol.</thinking><answer>Understood.</answer>' },
          ...conversationHistory
        ];

        let responseText = await callGeminiAPI(messagesPayload, token);
        
        let thinkMatch = responseText.match(/<thinking>([\s\S]*?)<\/thinking>/);
        let thinkingOutput = thinkMatch ? thinkMatch[1].trim() : "";

        // --- NEW MULTI-QUERY PARSING LOOP LAYER ---
        const toolLines = thinkingOutput.split("\n").filter(line => line.includes("CALL_FUNCTION:"));
        
        if (toolLines.length > 0) {
          removeTyping();
          renderOrUpdateMessage(aiMsgId, "Reading real-time data logs...", false, "", `Processing multi-query: Running ${toolLines.length} lookups...`);
          showTyping();
          
          conversationHistory.push({ role: 'assistant', content: responseText });
          let combinedToolResults = "";

          // Loop over all listed function calls dynamically
          for (const line of toolLines) {
            try {
              const jsonStr = line.replace("CALL_FUNCTION:", "").trim();
              const toolRequest = JSON.parse(jsonStr);
              const funcName = toolRequest.function;
              
              if (FunctionRegistry[funcName]) {
                const result = await FunctionRegistry[funcName](toolRequest);
                combinedToolResults += `\n${result}`;
              }
            } catch (err) {
              console.error("Failed executing tool call component:", err);
            }
          }

          // Return all structured server logs back in a single block context
          conversationHistory.push({ role: 'user', content: `[SYSTEM TOOL RESPONSES]: ${combinedToolResults}` });

          messagesPayload = [
            { role: 'user', content: SYSTEM_PROMPT },
            { role: 'model', content: '<thinking>Ready.</thinking><answer>Understood.</answer>' },
            ...conversationHistory
          ];
          
          responseText = await callGeminiAPI(messagesPayload, token);
        }

        // Final output processing layout
        thinkMatch = responseText.match(/<thinking>([\s\S]*?)<\/thinking>/);
        const answerMatch = responseText.match(/<answer>([\s\S]*?)<\/answer>/);

        thinkingOutput = thinkMatch ? thinkMatch[1].trim() : "";
        let answerOutput = answerMatch ? answerMatch[1].trim() : responseText.replace(/<thinking>[\s\S]*?<\/thinking>/, '').trim();

        removeTyping();
        streamIntoMessage(aiMsgId, answerOutput, parseMarkdown(thinkingOutput), "");
        conversationHistory.push({ role: 'assistant', content: responseText });

      } catch (error) {
        removeTyping();
        renderOrUpdateMessage(aiMsgId, `<div class="error-message">Error: ${error.message}</div>`, false);
        console.error('API Error:', error);
      } finally {
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
      const textarea = event.target;
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    // Voice-to-Text using MediaRecorder + Gemini Multimodal AI API
    const micBtn = document.getElementById('micBtn');
    let mediaRecorder = null;
    let mediaStream = null;
    let audioChunks = [];

    async function transcribeWithGemini(base64Audio, mimeType) {
      const chatInput = document.getElementById('chatInput');
      const originalPlaceholder = chatInput.placeholder;
      chatInput.value = "Transcribing with Gemini AI...";
      chatInput.disabled = true;
      micBtn.disabled = true;
      
      let token = null;
      if (!activeSessionToken) {
        token = turnstile.getResponse();
      }
      
      try {
        const response = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            transcribeAudio: base64Audio,
            mimeType: mimeType,
            model: currentModel,
            turnstileToken: token,
            sessionToken: activeSessionToken
          })
        });
        
        if (!response.ok) {
          throw new Error("Transcription API request failed.");
        }
        
        const data = await response.json();
        if (data.sessionToken) activeSessionToken = data.sessionToken;
        
        if (data.transcription) {
          chatInput.value = data.transcription;
        } else {
          chatInput.value = "";
          alert("Could not transcribe your audio. Make sure you spoke clearly!");
        }
      } catch (err) {
        console.error("Transcription error:", err);
        chatInput.value = "";
        alert("Transcription failed: " + err.message);
      } finally {
        chatInput.disabled = false;
        micBtn.disabled = false;
        chatInput.placeholder = originalPlaceholder;
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        chatInput.focus();
      }
    }

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) {
      micBtn.addEventListener('click', async () => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          // Stop recording
          mediaRecorder.stop();
        } else {
          // Start recording
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaStream = stream;
            
            // Choose supported MIME type
            let options = {};
            if (MediaRecorder.isTypeSupported('audio/webm')) {
              options = { mimeType: 'audio/webm' };
            } else if (MediaRecorder.isTypeSupported('audio/ogg')) {
              options = { mimeType: 'audio/ogg' };
            } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
              options = { mimeType: 'audio/mp4' };
            }
            
            mediaRecorder = new MediaRecorder(stream, options);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = (event) => {
              if (event.data && event.data.size > 0) {
                audioChunks.push(event.data);
              }
            };
            
            mediaRecorder.onstart = () => {
              micBtn.classList.add('listening');
              micBtn.innerHTML = '<i class="fas fa-stop"></i>';
              const chatInput = document.getElementById('chatInput');
              chatInput.placeholder = "Listening... Speak now and click again to stop.";
            };

            mediaRecorder.onstop = async () => {
              micBtn.classList.remove('listening');
              micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
              
              // Cleanly stop all mic tracks to release system device
              mediaStream.getTracks().forEach(track => track.stop());
              
              const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
              if (audioBlob.size > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                reader.onloadend = () => {
                  const base64Audio = reader.result.split(',')[1];
                  transcribeWithGemini(base64Audio, audioBlob.type);
                };
              }
            };

            mediaRecorder.start();
          } catch (err) {
            console.error("Mic access or recorder setup error:", err);
            alert("Could not start recording. Please make sure microphone permission is allowed.");
          }
        }
      });
    } else {
      micBtn.addEventListener('click', () => {
        alert("Your browser does not support audio recording (MediaRecorder). Please try a modern browser like Google Chrome, Firefox, or Safari.");
      });
    }

    // Text-to-Speech
    function speakText(text) {
      if (!window.speechSynthesis) return;

      if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
      }
      
      let phoneticText = text
          .replace(/AstralyxPvP/gi, "Astra-lix P V P")
          .replace(/AstralyxAI/gi, "Astra-lix A I")
          .replace(/Astralyx/gi, "Astra-lix");
  
      const utterance = new SpeechSynthesisUtterance(phoneticText);
      utterance.lang = 'en-US';
  
      // 3. SECURE THE CLOUD SOCKET VOICE
      const voices = window.speechSynthesis.getVoices();
      let preferredVoice = voices.find(v => v.name === "Google US English");
      
      if (!preferredVoice) {
          preferredVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google'));
      }
  
      if (preferredVoice) {
          utterance.voice = preferredVoice;
      } else {
          utterance.voice = voices.find(v => v.lang.startsWith('en'));
      }
  
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
  
      // 4. PREVENT CHROMIUM TRASH DROP FOR MULTIPLE CLICKS
      // Wrapping the execution in a minor timeout gives Chrome's internal WebSocket
      // pipeline enough breathing space (50ms) to clean its buffer without dropping the connection.
      setTimeout(() => {
          window.speechSynthesis.speak(utterance);
      }, 50);
  }
  </script>
  <button id="backToTop" onclick="scrollToTop()" title="Back to top" aria-label="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>
</body>
