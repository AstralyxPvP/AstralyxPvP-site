<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="kYWtU-P7VA6R31WMyTMMOKQ2ZHby0qlITXmdnE-xNZA" />
  <meta name="google-site-verification" content="dwWOJSf9PK5NvguaxcjVUYJCZK2Ehc_ZpdgavYEGgcs" />
  <meta name="google-site-verification" content="5x4oetuwUCYoInPARiV5ebPUEToLUzxiI1MfjvNc128" />
  <link rel="canonical" href="https://astralyxpvp.pages.dev" />
  <meta name="description" content="Chat with AstralyxAI - Your personal assistant for AstralyxPvP server information, rules, and support." />
  <meta name="keywords" content="AstralyxAI, chat, assistant, Minecraft, PvP, support" />
  <meta name="author" content="Frostrax (Owner), IndianCoder3 &amp; DreamLong (NebulaGames Developers)" />
  <link rel="stylesheet" href="Style/style.css">
  <style>
    /* Chat Container */
    .chat-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: radial-gradient(circle at top, #1a0000 0%, #000000 60%, #000 100%);
    }

    .chat-header {
      background: rgba(20, 20, 20, 0.8);
      backdrop-filter: blur(25px);
      border-bottom: 1px solid rgba(200, 16, 46, 0.3);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .chat-header h1 {
      margin: 0;
      font-size: 1.5rem;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .settings-btn {
      background: rgba(200, 16, 46, 0.2);
      border: 1px solid var(--primary);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .settings-btn:hover {
      background: rgba(200, 16, 46, 0.4);
    }

    /* Chat Messages Area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: messageSlideIn 0.3s ease;
    }

    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
    }

    .message.assistant .message-content {
      background: rgba(200, 16, 46, 0.1);
      border: 1px solid rgba(200, 16, 46, 0.3);
      color: var(--text);
    }

    .message.user .message-content {
      background: var(--primary);
      color: white;
      border-radius: 12px 0 12px 12px;
    }

    .message-content a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .message-content a:hover {
      text-decoration: underline;
    }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
    }

    .typing-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: typing 1.4s infinite;
    }

    .typing-dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: 0.3;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-10px);
      }
    }

    /* Input Area */
    .chat-input-area {
      padding: 16px 24px;
      background: rgba(20, 20, 20, 0.6);
      border-top: 1px solid rgba(200, 16, 46, 0.3);
      display: flex;
      gap: 12px;
    }

    .chat-input-wrapper {
      flex: 1;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .chat-input {
      flex: 1;
      background: rgba(40, 40, 40, 0.8);
      border: 1px solid rgba(200, 16, 46, 0.3);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      max-height: 100px;
      transition: all 0.3s ease;
    }

    .chat-input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(40, 40, 40, 1);
    }

    .send-btn {
      background: var(--primary);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      min-width: 80px;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      transform: translateY(-2px);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .model-indicator {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      margin-top: 4px;
    }

    /* Settings Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: rgba(20, 20, 20, 0.95);
      border: 1px solid rgba(200, 16, 46, 0.3);
      border-radius: 20px;
      padding: 32px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      backdrop-filter: blur(10px);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-header h2 {
      margin: 0;
      color: var(--accent);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .setting-group input,
    .setting-group select {
      width: 100%;
      padding: 10px;
      background: rgba(40, 40, 40, 0.8);
      border: 1px solid rgba(200, 16, 46, 0.3);
      color: var(--text);
      border-radius: 8px;
      font-family: inherit;
    }

    .setting-group input:focus,
    .setting-group select:focus {
      outline: none;
      border-color: var(--primary);
    }

    .save-settings-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-top: 16px;
      transition: all 0.3s ease;
    }

    .save-settings-btn:hover {
      background: var(--primary-soft);
    }

    .info-text {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 8px;
      line-height: 1.5;
    }

    /* Welcome Message */
    .welcome-message {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }

    .welcome-message h2 {
      color: var(--accent);
      margin-bottom: 16px;
      font-size: 1.5rem;
    }

    /* Navbar Integration */
    #navbar-placeholder {
      position: sticky;
      top: 0;
      z-index: 99;
    }

    body.chat-page {
      overflow: hidden;
    }

    .page-content {
      display: none;
    }

    .chat-page .page-content {
      display: none;
    }

    .token-info {
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 4px;
      text-align: center;
    }

    .error-message {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid #e74c3c;
      color: #e74c3c;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    @media (max-width: 768px) {
      .message-content {
        max-width: 100%;
      }

      .modal-content {
        padding: 20px;
      }

      .chat-header {
        padding: 12px 16px;
      }

      .chat-header h1 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body class="page-enter chat-page">

  <div id="navbar-placeholder"></div>

  <div class="chat-header">
    <h1>
      <i class="fa-solid fa-robot"></i> AstralyxAI
    </h1>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="welcome-message">
      <h2>Welcome to AstralyxAI</h2>
      <p>Your personal AI assistant for AstralyxPvP. Ask me anything about the server, rules, applications, voting, or anything else!</p>
    </div>
  </div>

  <div class="chat-input-area">
    <div class="chat-input-wrapper">
      <textarea 
        id="chatInput" 
        class="chat-input" 
        placeholder="Ask me about AstralyxPvP..." 
        rows="1"
        onkeydown="handleKeyPress(event)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div class="model-indicator">
    <span id="modelStatus">Model: Gemini 3.1 Flash Lite | Ready</span>
  </div>



  <div id="footer"></div>

  <script src="Script/script.js"></script>
  <script>
    // AstralyxAI Configuration
    const SYSTEM_PROMPT = `You are AstralyxAI 1.0, an elite, respectful AI assistant for the AstralyxPvP Minecraft server. You are knowledgeable, helpful, and always direct.

SERVER INFORMATION:
- Name: AstralyxPvP
- Type: India-based 1.9+ FFA PvP Server
- IP: none-subscribe.gl.joinmc.link
- Status: Skill-based ELO system with live leaderboards
- Free & Cracked: Yes, everyone is welcome
- Features: Custom ELO tracking, crates, skill-based battles

KEY PAGES & LINKS:
- [Main Website](https://astralyxpvp.pages.dev/)
- [Rules](https://astralyxpvp.pages.dev/rules)
- [Staff Application](https://astralyxpvp.pages.dev/apply)
- [Leaderboard](https://astralyxpvp.pages.dev/leaderboard)
- [Vote](https://astralyxpvp.pages.dev/vote)
- [Store](https://astralyxpvp.pages.dev/store)
- [Status](https://astralyxpvp.pages.dev/status)
- [Discord](https://discord.gg/u8BFrpRwEg)

RULES SUMMARY:
- No hacked clients, macros, autoclickers, or x-ray
- No exploits, glitches, dupes, or anti-cheat bypasses
- No boosting, win-trading, stat manipulation, or cross-teaming
- No hate speech, harassment, doxxing, or impersonation
- No fraudulent payments or chargebacks
- Ban evasion on alts = permanent IP ban
- Staff have final say in disputes

STAFF REQUIREMENTS:
- Conduct: Respectful, no harassment, stay calm
- Activity: 5+ hours per week in-game & Discord
- Responsibility: Secure account, no leaks, report bugs
- Apply through Discord #staff-application channel

VOTING:
- Vote daily on Minecraft-Server-List, TopG, and Minecraft-MP
- Claim rewards in-game after voting
- Report non-registering votes to staff on Discord

STORE & PAYMENTS:
- AstralyxPlus rank available
- YouTube rank available (free for content creators)
- All purchases final - refunds via support tickets
- Items arrive within 15 minutes

CRITICAL RESPONSE RULES:
1. ONLY answer the specific question asked. Never dump irrelevant links.
2. If greeted (hi, hello, etc), greet back casually and ask how you can help.
3. Use clean Markdown links only: [Text](https://url.com)
4. For staff applications: Direct to [Apply Here](https://astralyxpvp.pages.dev/apply)
5. For technical issues: Suggest contacting staff on Discord
6. For announcements: Direct to Discord #announcements
7. Keep responses concise, friendly, and professional
8. Never make up information about the server
9. Always be respectful and helpful
10. If unsure about something, admit it and direct to Discord support`;

    // Model Configuration
    const MODELS = {
      primary: 'gemini-2.0-flash-lite-preview-02-05',
      fallback: 'gemma-4-26b'
    };

    let currentModel = MODELS.primary;
    let conversationHistory = [];
    // === HARDCODE YOUR API KEY HERE ===
    let settings = {
      apiKey: 'YOUR_GEMINI_API_KEY', // <-- PUT YOUR API KEY HERE
      temperature: 1.0, // Medium creativity
      maxTokens: undefined // No token limit
    };

    function addMessage(content, isUser = false) {
      const messagesDiv = document.getElementById('chatMessages');

      // Remove welcome message if it exists
      const welcome = messagesDiv.querySelector('.welcome-message');
      if (welcome) welcome.remove();

      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

      const contentDiv = document.createElement('div');
      contentDiv.className = 'message-content';
      contentDiv.innerHTML = content;

      messageDiv.appendChild(contentDiv);
      messagesDiv.appendChild(messageDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTyping() {
      const messagesDiv = document.getElementById('chatMessages');
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message assistant';
      typingDiv.innerHTML = `
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      typingDiv.id = 'typingIndicator';
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById('typingIndicator');
      if (typing) typing.remove();
    }

    async function callGeminiAPI(messages) {
      if (!settings.apiKey || settings.apiKey === 'YOUR_GEMINI_API_KEY') {
        throw new Error('API key not set. Please edit the HTML and add your Gemini API key.');
      }

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${settings.apiKey}`;

      const payload = {
        contents: messages.map(msg => ({
          role: msg.role === 'user' ? 'user' : 'model',
          parts: [{ text: msg.content }]
        })),
        generationConfig: {
          temperature: settings.temperature
        }
      };

      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.error?.message || 'API Error');
      }

      const data = await response.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();

      if (!message) return;


      if (!settings.apiKey || settings.apiKey === 'YOUR_GEMINI_API_KEY') {
        addMessage('<div class="error-message">API key not set. Please edit the HTML and add your Gemini API key.</div>', false);
        return;
      }

      // Add user message
      addMessage(message, true);
      input.value = '';
      input.style.height = 'auto';

      document.getElementById('sendBtn').disabled = true;
      showTyping();

      try {
        // Add to history
        conversationHistory.push({ role: 'user', content: message });

        // Prepare messages with system prompt
        const messages = [
          { role: 'user', content: SYSTEM_PROMPT },
          { role: 'model', content: 'I understand. I am AstralyxAI, your assistant for AstralyxPvP.' },
          ...conversationHistory
        ];

        // Try primary model
        let response;
        try {
          response = await callGeminiAPI(messages);
          currentModel = MODELS.primary;
          document.getElementById('modelStatus').textContent = 'Model: Gemini 2.0 Flash Lite | Ready';
        } catch (primaryError) {
          console.log('Primary model failed, switching to fallback');
          currentModel = MODELS.fallback;
          document.getElementById('modelStatus').textContent = 'Model: Gemma 4 26B | Ready';
          response = await callGeminiAPI(messages);
        }

        // Format response with markdown links
        const formattedResponse = response
          .replace(/\[([^\]]+)\]\(([^\)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
          .replace(/\n/g, '<br>');

        removeTyping();
        addMessage(formattedResponse, false);
        conversationHistory.push({ role: 'assistant', content: response });

      } catch (error) {
        removeTyping();
        addMessage(`<div class="error-message">Error: ${error.message}</div>`, false);
        console.error('API Error:', error);
      } finally {
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }

      // Auto-resize textarea
      const textarea = event.target;
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
    }

    // Modal close on outside click
    document.getElementById('settingsModal').addEventListener('click', (e) => {
      if (e.target.id === 'settingsModal') closeSettings();
    });
  </script>

</body>
</html>
