  <style>
    /* Gemini-Inspired Red Theme Variables */
    :root {
      --bg-gradient: radial-gradient(circle at 50% 30%, #250407 0%, #0c0203 60%, #000000 100%);
      --primary-red: #c8102e;
      --primary-glow: rgba(200, 16, 46, 0.25);
      --glass-bg: rgba(18, 12, 13, 0.7);
      --glass-border: rgba(200, 16, 46, 0.2);
      --text-main: #f5f5f7;
      --text-muted: #9e9eaf;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body.chat-page {
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      background: var(--bg-gradient);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Header Bar */
    .chat-header {
      background: rgba(10, 5, 6, 0.6);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }

    .chat-header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #ff4d6d 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Messages Main Container */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 40px 20px 120px 20px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      max-width: 840px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    /* Gemini-Style Centered Hero Welcome Screen */
    .welcome-message {
      text-align: center;
      margin: auto 0;
      padding: 40px 20px;
      animation: fadeIn 0.8s ease;
    }

    .welcome-message h2 {
      font-size: 2.8rem;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #ffffff 30%, #ff334b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome-message p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 500px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Sleek Message Layouts */
    .message {
      display: flex;
      flex-direction: column;
      animation: messageSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      max-width: 85%;
    }

    .message.user {
      align-self: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
    }

    /* Sender labels like Gemini */
    .message-sender {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: var(--text-muted);
    }
    
    .message.user .message-sender {
      text-align: right;
      color: #ff4d6d;
    }

    .message-content {
      padding: 14px 20px;
      border-radius: 18px;
      font-size: 1rem;
      line-height: 1.5;
      word-wrap: break-word;
    }

    .message.assistant .message-content {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border-top-left-radius: 4px;
    }

    .message.user .message-content {
      background: linear-gradient(135deg, var(--primary-red) 0%, #900418 100%);
      color: #ffffff;
      border-top-right-radius: 4px;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    /* Modern AI Thinking Block - Collapsible */
    .thinking-container {
      margin-bottom: 12px;
      border-radius: 6px;
      overflow: hidden;
    }

    .thinking-container.collapsed .thinking-body {
      display: none;
    }

    .thinking-header {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      user-select: none;
      transition: background 0.15s;
    }

    .thinking-header:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .thinking-toggle {
      font-size: 0.7rem;
      color: #888;
      font-family: monospace;
      transition: transform 0.15s;
      width: 12px;
      text-align: center;
    }

    .thinking-title {
      font-size: 0.75rem;
      color: #888;
      font-style: normal;
      text-transform: lowercase;
    }

    .thinking-body {
      padding: 10px 12px;
      margin-top: 4px;
      background: rgba(255, 255, 255, 0.02);
      border-left: 2px solid rgba(200, 16, 46, 0.4);
      border-radius: 0 0 4px 4px;
      font-size: 0.88rem;
      color: #b0b0c0;
      font-style: italic;
      line-height: 1.5;
    }

    /* Tool Call Execution Logs inside Chat */
    .tool-log-container {
      background: rgba(200, 16, 46, 0.05);
      border: 1px dashed rgba(200, 16, 46, 0.3);
      padding: 8px 12px;
      margin-bottom: 12px;
      font-size: 0.82rem;
      color: #ff758f;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .message-content strong {
      font-weight: 700;
      color: var(--text-main);
    }

    .message-content em {
      font-style: italic;
    }

    .message-content a {
      color: #ff4d6d;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px dashed rgba(255, 77, 109, 0.4);
    }

    .message-content a:hover {
      color: #ff758f;
      border-bottom-style: solid;
    }

    .message-content pre {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 0.85rem;
      line-height: 1.5;
    }

    .message-content pre code {
      background: none;
      padding: 0;
      font-size: inherit;
      color: #e4e4ef;
    }

    .message-content code {
      background: rgba(200, 16, 46, 0.15);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.88rem;
      color: #ff758f;
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }

    .message-content blockquote {
      border-left: 3px solid var(--primary-red);
      margin: 8px 0;
      padding: 6px 14px;
      color: #b0b0c0;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 0 6px 6px 0;
    }

    .message-content ul, .message-content ol {
      margin: 6px 0;
      padding-left: 24px;
    }

    .message-content li {
      margin: 4px 0;
      line-height: 1.5;
    }

    .message-content h2, .message-content h3, .message-content h4 {
      margin: 16px 0 8px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .message-content h2 { font-size: 1.3rem; }
    .message-content h3 { font-size: 1.15rem; }
    .message-content h4 { font-size: 1.05rem; }

    .message-content hr {
      border: none;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 16px 0;
    }

    /* Floating Pill Input Box Area */
    .chat-input-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 760px;
      padding: 0 20px;
      box-sizing: border-box;
      z-index: 10;
    }

    .chat-input-area {
      background: var(--glass-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 8px 8px 8px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .chat-input-area:focus-within {
      border-color: rgba(200, 16, 46, 0.6);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px var(--primary-glow);
    }

    .chat-input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 10px 0;
      font-family: inherit;
      font-size: 1.05rem;
      resize: none;
      max-height: 120px;
      outline: none;
    }

    /* Clean Rounded Send Button */
    .send-btn {
      background: #ffffff;
      border: none;
      color: #000000;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background-color 0.2s;
    }

    .send-btn:hover {
      background: #ff4d6d;
      color: #ffffff;
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: 0.3;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    .model-indicator {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 10px;
      letter-spacing: 0.3px;
    }

    /* Modern Minimalist Typing Indicator */
    .typing-indicator {
      display: flex;
      gap: 6px;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 16px;
      width: fit-content;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ff4d6d;
      animation: typing 1.4s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50% { transform: translateY(-6px); opacity: 1; }
    }

    @keyframes messageSlideIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .error-message {
      background: rgba(231, 76, 60, 0.1);
      border: 1px solid #e74c3c;
      color: #e74c3c;
      padding: 12px 16px;
      border-radius: 12px;
    }

    .mic-btn {
      background: rgba(255, 255, 255, 0.05);
      border: none;
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background-color 0.2s;
    }
    .mic-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: scale(1.05);
    }
    .mic-btn.listening {
      background: var(--primary-red);
      color: white;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(200, 16, 46, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(200, 16, 46, 0); }
      100% { box-shadow: 0 0 0 0 rgba(200, 16, 46, 0); }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

    /* Compact mode: when embedded inside the chat widget card */
    body.embedded .chat-header { display: none; }
    body.embedded .chat-messages { padding: 18px 14px 110px; max-width: 100%; gap: 14px; }
    body.embedded .welcome-message { padding: 18px 12px; }
    body.embedded .welcome-message h2 { font-size: 1.4rem; letter-spacing: -0.4px; }
    body.embedded .welcome-message p { font-size: 0.9rem; max-width: 420px; }
    body.embedded .message { max-width: 92%; }
    body.embedded .message-content { padding: 10px 14px; font-size: 0.9rem; border-radius: 14px; }
    body.embedded .message-sender { font-size: 0.7rem; margin-bottom: 4px; }
    body.embedded .thinking-body { font-size: 0.8rem; }
    body.embedded .thinking-title { font-size: 0.7rem; }
    body.embedded .tool-log-container { font-size: 0.75rem; padding: 6px 10px; }
    body.embedded .chat-input-container { bottom: 10px; padding: 0 12px; max-width: 100%; }
    body.embedded .chat-input-area { border-radius: 22px; padding: 6px 6px 6px 16px; gap: 8px; }
    body.embedded .chat-input { font-size: 0.95rem; padding: 8px 0; max-height: 80px; }
    body.embedded .send-btn, body.embedded .mic-btn { width: 38px; height: 38px; font-size: 0.95rem; }
    body.embedded .model-indicator { font-size: 0.62rem; margin-top: 6px; letter-spacing: 0.2px; }
    body.embedded #backToTop { display: none; }
  </style>
</head>

<body class="page-enter chat-page">
  <script>
    if (window.self !== window.top) {
      document.body.classList.add('embedded');
      document.addEventListener('DOMContentLoaded', function () {
        var t = document.querySelector('.chat-header .cf-turnstile');
        var wrap = document.querySelector('.chat-input-container');
        if (t && wrap) {
          t.style.margin = '0 auto 8px';
          wrap.insertBefore(t, wrap.firstChild);
        }
      });
    }

    function onTurnstileSuccess() {
      document.querySelectorAll('.cf-turnstile').forEach(function (el) {
        el.style.display = 'none';
      });
    }

    function onTurnstileExpired() {
      document.querySelectorAll('.cf-turnstile').forEach(function (el) {
        el.style.display = '';
      });
      if (window.turnstile) turnstile.reset();
    }

    function onTurnstileError() {
      document.querySelectorAll('.cf-turnstile').forEach(function (el) {
        el.style.display = '';
      });
    }
  </script>

  <div class="chat-header">
    <h1>AstralyxAI</h1>
    <div class="cf-turnstile" data-sitekey="0x4AAAAAADWtJVafyNps0ZGt"
         data-callback="onTurnstileSuccess"
         data-expired-callback="onTurnstileExpired"
         data-error-callback="onTurnstileError"></div>
  </div>

  <main class="chat-messages" id="chatMessages">
    <div class="welcome-message">
      <h2>Welcome to AstralyxAI</h2>
      <p>Your elite companion for AstralyxPvP. Ask me anything about server rules, leaderboards, voting rewards, or applications.</p>
    </div>
  </main>

  <div class="chat-input-container">
    <form class="chat-input-area" onsubmit="event.preventDefault();sendMessage();">
      
      <div class="chat-input-wrapper">
        <textarea 
          id="chatInput" 
          class="chat-input" 
          placeholder="Ask AstralyxAI..." 
          rows="1"
          onkeydown="handleKeyPress(event)"
        >        </textarea>
      </div>
      <button type="button" class="mic-btn" id="micBtn" title="Speak to message"><i class="fas fa-microphone"></i></button>
      <button class="send-btn" id="sendBtn" type="submit">➔</button>
    </form>
    <div class="model-indicator">
      <span>AstralyxAI can make mistakes. Verify critical server rules on Discord.</span>
    </div>
  </div>

  <script src="Script/script.js"></script>

  <script>
    const isMaintenanceActive = false;
    const WEB_CHAT_API = 'https://discord-ai-bot.indiancoder3.workers.dev/web-chat';

    const SESSION_STORAGE_KEY = 'astralyxai-web-session';
    let activeSessionToken = null;
    try {
      activeSessionToken = sessionStorage.getItem(SESSION_STORAGE_KEY);
    } catch (error) {
      console.error('Could not restore AstralyxAI session:', error);
    }

    function saveSessionToken(token) {
      activeSessionToken = token;
      try {
        sessionStorage.setItem(SESSION_STORAGE_KEY, token);
      } catch (error) {
        console.error('Could not save AstralyxAI session:', error);
      }
    }

    function clearSessionToken() {
      activeSessionToken = null;
      try {
        sessionStorage.removeItem(SESSION_STORAGE_KEY);
      } catch (error) {
        console.error('Could not clear AstralyxAI session:', error);
      }
    }

    let messageCounter = 0;
    function generateId() {
      return `msg-id-${Date.now()}-${messageCounter++}`;
    }

    function renderOrUpdateMessage(msgId, content, isUser = false) {
      const messagesDiv = document.getElementById('chatMessages');
      const welcome = messagesDiv.querySelector('.welcome-message');
      if (welcome) welcome.remove();

      let messageDiv = document.getElementById(msgId);
      
      if (!messageDiv) {
        messageDiv = document.createElement('div');
        messageDiv.id = msgId;
        messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;

        const senderLabel = document.createElement('div');
        senderLabel.className = 'message-sender';
        senderLabel.textContent = isUser ? 'You' : 'AstralyxAI';

        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';

        messageDiv.appendChild(senderLabel);
        messageDiv.appendChild(contentDiv);
        messagesDiv.appendChild(messageDiv);
      }

      const contentDiv = messageDiv.querySelector('.message-content');
      contentDiv.innerHTML = '';

      const textBody = document.createElement('div');
      if (isUser) textBody.textContent = content;
      else textBody.innerHTML = content;
      contentDiv.appendChild(textBody);

      if (!isUser) {
        const speakBtn = document.createElement('button');
        speakBtn.innerHTML = '<i class="fas fas fa-volume-up"></i>';
        speakBtn.style.background = 'transparent';
        speakBtn.style.border = 'none';
        speakBtn.style.color = 'var(--text-muted)';
        speakBtn.style.cursor = 'pointer';
        speakBtn.style.fontSize = '1.1rem';
        speakBtn.style.display = 'block';
        speakBtn.style.marginTop = '10px';
        speakBtn.onclick = () => speakText(textBody.innerText);
        contentDiv.appendChild(speakBtn);
      }

      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function streamIntoMessage(msgId, fullText) {
      const messagesDiv = document.getElementById('chatMessages');
      const welcome = messagesDiv.querySelector('.welcome-message');
      if (welcome) welcome.remove();

      let messageDiv = document.getElementById(msgId);
      if (!messageDiv) {
        messageDiv = document.createElement('div');
        messageDiv.id = msgId;
        messageDiv.className = 'message assistant';
        const senderLabel = document.createElement('div');
        senderLabel.className = 'message-sender';
        senderLabel.textContent = 'AstralyxAI';
        const contentDiv = document.createElement('div');
        contentDiv.className = 'message-content';
        messageDiv.appendChild(senderLabel);
        messageDiv.appendChild(contentDiv);
        messagesDiv.appendChild(messageDiv);
      }

      const contentDiv = messageDiv.querySelector('.message-content');
      contentDiv.innerHTML = '';

      const textBody = document.createElement('div');
      contentDiv.appendChild(textBody);

      let displayed = '';
      const chars = [...fullText];
      for (let i = 0; i < chars.length; i++) {
        displayed += chars[i];
        textBody.innerHTML = parseMarkdown(displayed);
        if (i % 2 === 0) {
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        const delay = chars[i].match(/[.!?]\s*$/) ? 60 : 12;
        await new Promise(r => setTimeout(r, delay));
      }

      const speakBtn = document.createElement('button');
      speakBtn.innerHTML = '<i class="fas fas fa-volume-up"></i>';
      speakBtn.style.background = 'transparent';
      speakBtn.style.border = 'none';
      speakBtn.style.color = 'var(--text-muted)';
      speakBtn.style.cursor = 'pointer';
      speakBtn.style.fontSize = '1.1rem';
      speakBtn.style.display = 'block';
      speakBtn.style.marginTop = '10px';
      speakBtn.onclick = () => speakText(textBody.innerText);
      contentDiv.appendChild(speakBtn);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showTyping() {
      const messagesDiv = document.getElementById('chatMessages');
      if(document.getElementById('typingIndicator')) return;
      
      const typingDiv = document.createElement('div');
      typingDiv.className = 'message assistant';
      typingDiv.innerHTML = `
        <div class="message-sender">AstralyxAI</div>
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      typingDiv.id = 'typingIndicator';
      messagesDiv.appendChild(typingDiv);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById('typingIndicator');
      if (typing) typing.remove();
    }

    async function callWebChat(payload) {
      const requestBody = { ...payload };
      if (activeSessionToken) requestBody.sessionToken = activeSessionToken;

      const response = await fetch(WEB_CHAT_API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody)
      });
      const data = await response.json();

      if (!response.ok) {
        if (response.status === 403 && data.error?.startsWith('Session expired')) {
          clearSessionToken();
          if (window.turnstile) turnstile.reset();
        }
        throw new Error(data.error || `AI service returned ${response.status}`);
      }

      if (data.sessionToken) saveSessionToken(data.sessionToken);
      return data;
    }

    const parseMarkdown = (text) => {
      if (!text) return '';
      if (typeof marked !== 'undefined' && marked.parse) {
        return marked.parse(text, { breaks: true, gfm: true });
      }
      // Fallback if marked CDN fails to load
      return text
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`(.+?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
    };
    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if (!message) return;

      const payload = { message };
      if (!activeSessionToken) {
        const token = window.turnstile?.getResponse();
        if (!token) {
          alert('Please verify you are human.');
          return;
        }
        payload.turnstileToken = token;
      }

      const userMsgId = generateId();
      const aiMsgId = generateId();
      renderOrUpdateMessage(userMsgId, message, true);
      input.value = '';
      input.style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;
      showTyping();

      try {
        const data = await callWebChat(payload);
        if (typeof data.text !== 'string' || !data.text.trim()) {
          throw new Error('AstralyxAI returned an empty response.');
        }
        removeTyping();
        await streamIntoMessage(aiMsgId, data.text);
      } catch (error) {
        removeTyping();
        renderOrUpdateMessage(aiMsgId, '', false);
        document.getElementById(aiMsgId).querySelector('.message-content').textContent = `Error: ${error.message}`;
        console.error('AstralyxAI request failed:', error);
      } finally {
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
      const textarea = event.target;
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }

    // Voice-to-Text using MediaRecorder + Gemini Multimodal AI API
    const micBtn = document.getElementById('micBtn');
    let mediaRecorder = null;
    let mediaStream = null;
    let audioChunks = [];

    async function transcribeWithGemini(base64Audio, mimeType) {
      const chatInput = document.getElementById('chatInput');
      const originalPlaceholder = chatInput.placeholder;
      const payload = { transcribeAudio: base64Audio, mimeType };

      if (!activeSessionToken) {
        const token = window.turnstile?.getResponse();
        if (!token) {
          alert('Please verify you are human before using voice input.');
          return;
        }
        payload.turnstileToken = token;
      }

      chatInput.value = 'Transcribing audio...';
      chatInput.disabled = true;
      micBtn.disabled = true;

      try {
        const data = await callWebChat(payload);
        if (data.transcription) {
          chatInput.value = data.transcription;
        } else {
          chatInput.value = '';
          alert('Could not transcribe your audio. Make sure you spoke clearly!');
        }
      } catch (error) {
        console.error('Transcription error:', error);
        chatInput.value = '';
        alert(`Transcription failed: ${error.message}`);
      } finally {
        chatInput.disabled = false;
        micBtn.disabled = false;
        chatInput.placeholder = originalPlaceholder;
        chatInput.style.height = 'auto';
        chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        chatInput.focus();
      }
    }

    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) {
      micBtn.addEventListener('click', async () => {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          // Stop recording
          mediaRecorder.stop();
        } else {
          // Start recording
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaStream = stream;
            
            // Choose supported MIME type
            let options = {};
            if (MediaRecorder.isTypeSupported('audio/webm')) {
              options = { mimeType: 'audio/webm' };
            } else if (MediaRecorder.isTypeSupported('audio/ogg')) {
              options = { mimeType: 'audio/ogg' };
            } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
              options = { mimeType: 'audio/mp4' };
            }
            
            mediaRecorder = new MediaRecorder(stream, options);
            audioChunks = [];
            
            mediaRecorder.ondataavailable = (event) => {
              if (event.data && event.data.size > 0) {
                audioChunks.push(event.data);
              }
            };
            
            mediaRecorder.onstart = () => {
              micBtn.classList.add('listening');
              micBtn.innerHTML = '<i class="fas fa-stop"></i>';
              const chatInput = document.getElementById('chatInput');
              chatInput.placeholder = "Listening... Speak now and click again to stop.";
            };

            mediaRecorder.onstop = async () => {
              micBtn.classList.remove('listening');
              micBtn.innerHTML = '<i class="fas fa-microphone"></i>';
              
              // Cleanly stop all mic tracks to release system device
              mediaStream.getTracks().forEach(track => track.stop());
              
              const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
              if (audioBlob.size > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(audioBlob);
                reader.onloadend = () => {
                  const base64Audio = reader.result.split(',')[1];
                  transcribeWithGemini(base64Audio, audioBlob.type);
                };
              }
            };

            mediaRecorder.start();
          } catch (err) {
            console.error("Mic access or recorder setup error:", err);
            alert("Could not start recording. Please make sure microphone permission is allowed.");
          }
        }
      });
    } else {
      micBtn.addEventListener('click', () => {
        alert("Your browser does not support audio recording (MediaRecorder). Please try a modern browser like Google Chrome, Firefox, or Safari.");
      });
    }

    // Text-to-Speech
    function speakText(text) {
      if (!window.speechSynthesis) return;

      if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
      }
      
      let phoneticText = text
          .replace(/AstralyxPvP/gi, "Astra-lix P V P")
          .replace(/AstralyxAI/gi, "Astra-lix A I")
          .replace(/Astralyx/gi, "Astra-lix");
  
      const utterance = new SpeechSynthesisUtterance(phoneticText);
      utterance.lang = 'en-US';
  
      // 3. SECURE THE CLOUD SOCKET VOICE
      const voices = window.speechSynthesis.getVoices();
      let preferredVoice = voices.find(v => v.name === "Google US English");
      
      if (!preferredVoice) {
          preferredVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google'));
      }
  
      if (preferredVoice) {
          utterance.voice = preferredVoice;
      } else {
          utterance.voice = voices.find(v => v.lang.startsWith('en'));
      }
  
      utterance.rate = 1.0;
      utterance.pitch = 1.0;
  
      // 4. PREVENT CHROMIUM TRASH DROP FOR MULTIPLE CLICKS
      // Wrapping the execution in a minor timeout gives Chrome's internal WebSocket
      // pipeline enough breathing space (50ms) to clean its buffer without dropping the connection.
      setTimeout(() => {
          window.speechSynthesis.speak(utterance);
      }, 50);
  }
  </script>
  <button id="backToTop" onclick="scrollToTop()" title="Back to top" aria-label="Back to top">
    <i class="fa-solid fa-arrow-up"></i>
  </button>
</body>
