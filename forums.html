<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forums — AstralyxPvP</title>
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://forums.astralyxpvp.org">
<link rel="canonical" href="https://forums.astralyxpvp.org">
<style>
  :root {
    --red: #C8102E;
    --gold: #FFD700;
    --bg: #0A0204;
    --text: #EDE7E2;
    --muted: #9A8F8A;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 20%, rgba(200, 16, 46, 0.12), transparent 55%),
      radial-gradient(circle at 50% 80%, rgba(255, 215, 0, 0.05), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .redirect-box { max-width: 420px; }
  .redirect-spinner {
    width: 44px;
    height: 44px;
    margin: 0 auto 22px;
    border-radius: 50%;
    border: 3px solid rgba(255, 215, 0, 0.15);
    border-top-color: var(--gold);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    font-size: 1.3rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }
  h1 span { color: var(--red); }
  p { color: var(--muted); font-size: 0.95rem; line-height: 1.6; }
  a.redirect-link {
    display: inline-block;
    margin-top: 20px;
    color: var(--gold);
    text-decoration: none;
    font-weight: 700;
    font-size: 0.9rem;
    border: 1px solid rgba(255, 215, 0, 0.3);
    padding: 10px 22px;
    border-radius: 999px;
    transition: background 0.2s ease;
  }
  a.redirect-link:hover { background: rgba(255, 215, 0, 0.1); }
</style>
</head>
<body>
  <div class="redirect-box">
    <div class="redirect-spinner" aria-hidden="true"></div>
    <h1>Taking you to the <span>Forums</span>…</h1>
    <p>The AstralyxPvP community forums now live at forums.astralyxpvp.org.</p>
    <p>If you are not redirected automatically, click below.</p>
    <a class="redirect-link" href="https://forums.astralyxpvp.org">Open Forums <i class="fa-solid fa-arrow-up-right-from-square" style="font-style: normal;">&#8599;</i></a>
  </div>
  <script>
    window.location.replace('https://forums.astralyxpvp.org');
  </script>
</body>
</html>
