<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forums — AstralyxPvP</title>
<link rel="stylesheet" href="Style/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<script>
  async function loadHead() {
    try {
      const r = await fetch('Assets/head.html');
      const t = await r.text();
      const doc = new DOMParser().parseFromString(t,'text/html');
      for (const node of doc.head.childNodes) {
        if (node.tagName==='SCRIPT') {
          const s=document.createElement('script');
          [...node.attributes].forEach(a=>s.setAttribute(a.name,a.value));
          s.textContent=node.textContent; document.head.appendChild(s);
        } else document.head.appendChild(node);
      }
    } catch(e) {}
  }
  loadHead();
</script>
<style>
/* ── Forum-scoped styles using site CSS tokens ── */

/* NAV — same pill style as news.html */
.fr-nav {
  position: fixed; top: 20px; left: 50%; translate: -50% 0;
  z-index: 9999; width: min(92%,1200px);
  padding: 14px 24px;
  display: flex; align-items: center; gap: 12px;
  background: transparent; border: 1px solid transparent;
  border-radius: var(--r-pill);
  animation: navDrop 0.7s var(--ease) both;
  transition: background .3s ease, backdrop-filter .3s ease, box-shadow .3s ease, border-color .3s ease;
}
.fr-nav.scrolled {
  top: 0; border-radius: 0 0 var(--r-pill) var(--r-pill);
  background: rgba(10,4,6,.92);
  backdrop-filter: blur(14px) saturate(120%);
  -webkit-backdrop-filter: blur(14px) saturate(120%);
  border-color: rgba(255,255,255,.08);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 8px 32px rgba(0,0,0,.5);
}
.fr-brand { display:inline-flex; align-items:center; gap:.8rem; text-decoration:none; }
.fr-brand-mark {
  display:grid; place-items:center; width:42px; height:42px;
  border-radius:12px; border:1px solid rgba(255,215,0,.28);
  background: radial-gradient(circle at 28% 18%,rgba(255,255,255,.15),transparent 18%),
              linear-gradient(135deg,rgba(255,215,0,.18),rgba(200,16,46,.10)),
              rgba(10,4,6,.72);
  box-shadow: 0 0 14px rgba(200,16,46,.34), 0 0 40px rgba(255,215,0,.08);
  backdrop-filter: blur(20px);
  animation: floatLogo 4.8s var(--ease) infinite;
  flex-shrink:0;
}
.fr-brand-mark img { width:100%; height:100%; border-radius:inherit; object-fit:cover; filter:drop-shadow(0 0 6px rgba(200,16,46,.5)); }
.fr-brand-text { display:grid; line-height:1; text-transform:uppercase; letter-spacing:.18em; font-weight:900; font-size:.85rem; font-family:'Consolas','Lucida Console',monospace; }
.fr-brand-text span:last-child { margin-top:.18rem; color:var(--red); font-size:.68rem; letter-spacing:.34em; }
.fr-brand-sub { font-size:.55rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:.2em; font-family:'Consolas',monospace; margin-top:.1rem; }
.fr-sp { flex:1; }
.fr-back { font-size:.72rem; color:var(--text-muted); text-decoration:none; font-family:'Consolas',monospace; text-transform:uppercase; letter-spacing:.07em; padding:.45rem .8rem; border:1px solid rgba(255,255,255,.07); border-radius:var(--r-pill); background:rgba(18,8,10,.55); backdrop-filter:blur(14px); transition:all var(--t-fast) var(--ease); white-space:nowrap; }
.fr-back:hover { border-color:var(--red-glow); color:var(--text); }
#frAuthBtn { display:flex; align-items:center; }

@media(max-width:860px) {
  .fr-nav { position:fixed; top:0; left:0; translate:none; width:100%; border-radius:0; padding:10px 16px; animation:none; background:rgba(8,3,5,.96); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border:none; border-bottom:1px solid rgba(200,16,46,.18); box-shadow:0 4px 24px rgba(0,0,0,.5); }
  .fr-brand-text { display:none; }
  .fr-back { display:none; }
}

/* Buttons */
.fb { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:var(--r-sm); font-size:13px; font-weight:700; font-family:var(--font-body); border:1px solid transparent; cursor:pointer; transition:all var(--t-fast) var(--ease); white-space:nowrap; min-height:36px; text-decoration:none; }
.fb-red { background:var(--red); color:#fff; border-color:var(--red); }
.fb-red:hover { background:var(--red-deep); box-shadow:0 4px 16px var(--red-glow); }
.fb-outline { background:transparent; color:var(--text-muted); border-color:var(--border); }
.fb-outline:hover { border-color:var(--red-glow); color:var(--text); }
.fb-ghost { background:transparent; color:var(--text-muted); border-color:var(--border); font-size:12px; padding:5px 11px; min-height:30px; }
.fb-ghost:hover { color:var(--text); background:rgba(255,255,255,.04); }
.fb-danger { background:transparent; color:#f07070; border-color:rgba(240,112,112,.3); font-size:12px; padding:5px 11px; min-height:30px; }
.fb-danger:hover { background:rgba(240,112,112,.08); }
.fb-discord { background:#5865f2; color:#fff; border-color:#5865f2; }
.fb-discord:hover { background:#4752c4; }
.fb:disabled { opacity:.5; cursor:not-allowed; }
@media(max-width:600px) { .fb { min-height:40px; } }

/* User chip */
.fr-user { display:flex; align-items:center; gap:7px; }
.fr-uav { width:28px; height:28px; border-radius:50%; border:1.5px solid rgba(255,215,0,.3); object-fit:cover; box-shadow:0 0 10px rgba(200,16,46,.3); }
.fr-uname { font-size:.72rem; font-weight:700; color:var(--text); font-family:'Consolas',monospace; text-transform:uppercase; letter-spacing:.07em; max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fr-badge { font-size:.6rem; font-weight:700; padding:2px 7px; border-radius:var(--r-pill); background:rgba(200,16,46,.12); border:1px solid var(--red-glow); color:var(--red); text-transform:uppercase; letter-spacing:.08em; font-family:'Consolas',monospace; }
.fr-badge.staff { background:rgba(255,215,0,.1); border-color:rgba(255,215,0,.3); color:var(--gold); }

/* Main */
.fr-main { max-width:1060px; margin:0 auto; padding:100px 16px 80px; }
@media(max-width:860px) { .fr-main { padding-top:72px; } }

/* Views */
.fr-view { display:none; }
.fr-view.active { display:block; }

/* ── LIST VIEW ── */
.fr-top { display:flex; align-items:center; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.fr-top h1 { font-family:var(--font-display); font-size:clamp(1.3rem,3.5vw,1.9rem); font-weight:800; color:var(--text); flex:1; }
.fr-top h1 span { color:var(--red); }

/* Search */
.fr-search-wrap { position:relative; width:100%; margin-bottom:14px; }
.fr-search-wrap i { position:absolute; left:12px; top:50%; translate:0 -50%; color:var(--text-muted); font-size:13px; }
.fr-search { width:100%; padding:9px 12px 9px 34px; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:var(--r-sm); color:var(--text); font-size:14px; font-family:var(--font-body); outline:none; transition:border-color var(--t-fast) var(--ease); }
.fr-search:focus { border-color:var(--red-glow); }
.fr-search::placeholder { color:var(--text-faint); }

/* Category bar */
.fr-cats { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:18px; }
.fr-cat { font-size:12px; padding:5px 14px; border-radius:var(--r-pill); border:1px solid var(--border); background:transparent; color:var(--text-muted); cursor:pointer; font-family:var(--font-body); transition:all var(--t-fast) var(--ease); min-height:32px; display:flex; align-items:center; gap:5px; }
.fr-cat:hover { border-color:var(--red-glow); color:var(--text); }
.fr-cat.on { background:rgba(200,16,46,.1); border-color:var(--red-glow); color:var(--red); font-weight:700; }

/* Thread list — Pika style */
.fr-list { display:flex; flex-direction:column; gap:2px; }
.fr-list-hdr { display:grid; grid-template-columns:1fr 80px 90px; gap:8px; padding:6px 14px; font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; font-family:var(--font-body); border-bottom:1px solid var(--border); margin-bottom:4px; }
@media(max-width:600px) { .fr-list-hdr { display:none; } }

.fr-thread-row {
  display:grid; grid-template-columns:1fr 80px 90px;
  gap:8px; align-items:center;
  padding:12px 14px;
  background:rgba(255,255,255,.02);
  border:1px solid var(--border);
  border-radius:var(--r-sm);
  cursor:pointer;
  transition:border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.fr-thread-row:hover { border-color:var(--red-glow); background:rgba(200,16,46,.04); }
@media(max-width:600px) {
  .fr-thread-row { grid-template-columns:1fr; gap:6px; }
  .fr-tr-replies, .fr-tr-date { display:none; }
}
.fr-tr-main { display:flex; flex-direction:column; gap:5px; min-width:0; }
.fr-tr-title-row { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.fr-tr-pin { color:var(--gold); font-size:11px; }
.fr-tr-title { font-family:var(--font-display); font-size:.92rem; font-weight:800; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fr-tr-title:hover { color:var(--red); }
.fr-tr-meta { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.fr-tr-av { width:18px; height:18px; border-radius:50%; object-fit:cover; border:1px solid var(--border); flex-shrink:0; }
.fr-tr-author { font-size:11px; color:var(--text-muted); font-family:var(--font-body); }
.fr-tr-cat { font-size:10px; padding:1px 7px; border-radius:var(--r-pill); background:rgba(200,16,46,.1); border:1px solid var(--red-glow); color:var(--red); font-family:var(--font-body); font-weight:700; }
.fr-tag { font-size:10px; padding:1px 7px; border-radius:var(--r-pill); background:rgba(255,215,0,.07); border:1px solid rgba(255,215,0,.18); color:var(--gold); font-family:var(--font-body); }
.fr-tr-replies { font-size:12px; color:var(--text-muted); font-family:var(--font-body); text-align:center; }
.fr-tr-replies strong { color:var(--text); font-size:14px; display:block; }
.fr-tr-date { font-size:11px; color:var(--text-muted); font-family:var(--font-body); text-align:right; }
.fr-state { text-align:center; padding:50px 20px; color:var(--text-muted); font-family:var(--font-body); }
.fr-state-icon { font-size:36px; margin-bottom:12px; }

/* ── THREAD VIEW ── */
.fr-thread-hdr { margin-bottom:20px; }
.fr-breadcrumb { font-size:12px; color:var(--text-muted); font-family:var(--font-body); margin-bottom:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.fr-breadcrumb a { color:var(--red); text-decoration:none; cursor:pointer; }
.fr-breadcrumb a:hover { text-decoration:underline; }
.fr-thread-title-bar { display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; }
.fr-thread-title { font-family:var(--font-display); font-size:clamp(1.2rem,3.5vw,1.7rem); font-weight:800; color:var(--text); line-height:1.25; flex:1; }
.fr-thread-badges { display:flex; gap:5px; flex-wrap:wrap; margin-top:8px; }

/* Post card — Pika style: avatar left, content right */
.fr-post {
  display:grid; grid-template-columns:60px 1fr;
  gap:0; border:1px solid var(--border);
  border-radius:var(--r-md); overflow:hidden;
  margin-bottom:12px;
  background:rgba(255,255,255,.02);
}
.fr-post.op { border-color:rgba(200,16,46,.25); }
@media(max-width:600px) { .fr-post { grid-template-columns:1fr; } }

.fr-post-sidebar {
  background:rgba(255,255,255,.02);
  border-right:1px solid var(--border);
  padding:16px 10px;
  display:flex; flex-direction:column;
  align-items:center; gap:6px;
  text-align:center;
}
@media(max-width:600px) {
  .fr-post-sidebar { flex-direction:row; border-right:none; border-bottom:1px solid var(--border); padding:10px 14px; justify-content:flex-start; gap:10px; }
}
.fr-post-av { width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid var(--border); }
.fr-post.op .fr-post-av { border-color:rgba(200,16,46,.4); box-shadow:0 0 12px rgba(200,16,46,.2); }
.fr-post-uname { font-size:11px; font-weight:800; color:var(--text); font-family:var(--font-body); word-break:break-all; }
.fr-post-role { font-size:9px; padding:1px 6px; border-radius:var(--r-pill); background:rgba(200,16,46,.1); border:1px solid var(--red-glow); color:var(--red); text-transform:uppercase; font-weight:700; font-family:'Consolas',monospace; }

@media(max-width:600px) { .fr-post-uname,.fr-post-role { text-align:left; } }

.fr-post-body { padding:14px 16px; display:flex; flex-direction:column; min-width:0; }
.fr-post-top { display:flex; align-items:center; gap:8px; margin-bottom:12px; padding-bottom:8px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.fr-post-num { font-size:11px; color:var(--text-muted); font-family:var(--font-body); }
.fr-post-date { font-size:11px; color:var(--text-muted); font-family:var(--font-body); }
.fr-post-actions { margin-left:auto; display:flex; gap:5px; }
.fr-post-content { flex:1; }

/* Markdown same as news */
.fr-md { font-family:var(--font-body); font-size:14px; color:var(--text); line-height:1.78; word-break:break-word; }
.fr-md h1 { font-family:var(--font-display); font-size:1.4rem; color:var(--text); border-bottom:1px solid var(--border); padding-bottom:6px; margin:20px 0 10px; }
.fr-md h2 { font-family:var(--font-display); font-size:1.15rem; color:var(--text); margin:16px 0 8px; }
.fr-md h3 { font-family:var(--font-display); font-size:1rem; color:var(--text); margin:12px 0 6px; }
.fr-md p { margin:8px 0; }
.fr-md strong { color:#fff; font-weight:700; }
.fr-md em { color:var(--muted); }
.fr-md a { color:var(--gold); }
.fr-md code { background:rgba(255,255,255,.06); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-family:'Fira Code',monospace; font-size:12px; color:#e6c07b; }
.fr-md pre { background:#000; border:1px solid var(--border); border-radius:var(--r-sm); padding:12px 14px; overflow-x:auto; margin:12px 0; }
.fr-md pre code { background:none; border:none; padding:0; color:#e6edf3; font-size:12px; }
.fr-md blockquote { border-left:3px solid var(--red); padding:3px 0 3px 12px; margin:12px 0; color:var(--muted); }
.fr-md ul,.fr-md ol { padding-left:20px; margin:8px 0; }
.fr-md li { margin:3px 0; }
.fr-md table { width:100%; border-collapse:collapse; margin:12px 0; font-size:13px; display:block; overflow-x:auto; }
.fr-md th { background:rgba(200,16,46,.1); color:var(--text); padding:7px 10px; text-align:left; border:1px solid var(--border); }
.fr-md td { padding:6px 10px; border:1px solid var(--border); color:var(--muted); }
.fr-md img { max-width:100%; border-radius:var(--r-sm); margin:10px 0; border:1px solid var(--border); }
.fr-md hr { border:none; border-top:1px solid var(--border); margin:16px 0; }

/* Replies header */
.fr-replies-hdr { font-family:var(--font-display); font-size:.95rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.1em; margin:24px 0 10px; display:flex; align-items:center; gap:8px; }
.fr-replies-hdr::after { content:''; flex:1; height:1px; background:var(--border); }

/* Reply box */
.fr-reply-box { background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:var(--r-md); padding:16px; margin-top:20px; }
.fr-reply-box h3 { font-family:var(--font-display); font-size:.9rem; font-weight:800; color:var(--text); margin-bottom:12px; }
.fr-reply-tabs { display:flex; border:1px solid var(--border); border-radius:var(--r-sm); overflow:hidden; width:fit-content; margin-bottom:8px; }
.fr-reply-tab { padding:5px 12px; font-size:12px; font-weight:700; font-family:var(--font-body); border:none; background:rgba(255,255,255,.02); color:var(--text-muted); cursor:pointer; transition:all var(--t-fast) var(--ease); }
.fr-reply-tab:not(:last-child) { border-right:1px solid var(--border); }
.fr-reply-tab.on { background:rgba(200,16,46,.1); color:var(--text); }
.fr-reply-ta { width:100%; height:140px; padding:11px; background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:var(--r-sm); color:var(--text); font-family:'Fira Code',monospace; font-size:13px; line-height:1.65; resize:vertical; outline:none; transition:border-color var(--t-fast) var(--ease); min-height:100px; }
.fr-reply-ta:focus { border-color:var(--red-glow); }
.fr-reply-prev { min-height:100px; padding:11px; background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:var(--r-sm); display:none; overflow-y:auto; max-height:200px; }
.fr-reply-foot { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
.fr-reply-st { font-size:12px; font-family:var(--font-body); }
.fr-reply-st.ok { color:var(--gold); }
.fr-reply-st.er { color:#f07070; }
.fr-login-nudge { text-align:center; padding:20px; background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:var(--r-md); margin-top:20px; font-family:var(--font-body); font-size:14px; color:var(--text-muted); }
.fr-login-nudge a { color:var(--red); cursor:pointer; }

/* New thread modal */
.fr-modal-ovl { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:600; display:flex; justify-content:center; align-items:flex-start; overflow:hidden; opacity:0; pointer-events:none; transition:opacity var(--t-fast) var(--ease); }
.fr-modal-ovl.open { opacity:1; pointer-events:auto; }
.fr-modal-box { background:#0a0204; border:1px solid var(--border); width:100%; max-width:820px; height:100%; display:flex; flex-direction:column; overflow:hidden; }
@media(min-width:841px) { .fr-modal-box { margin:20px auto; height:calc(100vh - 40px); border-radius:var(--r-md); } }
.fr-modal-hdr { display:flex; align-items:center; gap:10px; padding:13px 18px; border-bottom:1px solid var(--border); background:rgba(255,255,255,.02); flex-shrink:0; }
.fr-modal-hdr h2 { font-family:var(--font-display); font-size:1rem; font-weight:800; color:var(--text); flex:1; }
.fr-modal-body { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; }
.fr-modal-ftr { display:flex; gap:8px; align-items:center; padding:12px 18px; border-top:1px solid var(--border); background:rgba(255,255,255,.02); flex-shrink:0; flex-wrap:wrap; }
.fr-modal-st { font-size:12px; flex:1; font-family:var(--font-body); }
.fr-modal-st.ok { color:var(--gold); }
.fr-modal-st.er { color:#f07070; }

.fr-lbl { font-size:11px; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; display:block; font-family:var(--font-body); }
.fr-lbl .req { color:var(--red); }
.fr-hint { font-size:11px; color:var(--text-muted); margin-top:3px; font-family:var(--font-body); }
.fr-inp { width:100%; padding:9px 13px; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:var(--r-sm); color:var(--text); font-size:14px; font-family:var(--font-body); outline:none; transition:border-color var(--t-fast) var(--ease); }
.fr-inp:focus { border-color:var(--red-glow); }
.fr-inp::placeholder { color:var(--text-faint); }
.fr-select { width:100%; padding:9px 13px; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:var(--r-sm); color:var(--text); font-size:14px; font-family:var(--font-body); outline:none; cursor:pointer; }
.fr-select option { background:#0a0204; }
.fr-ta { width:100%; height:220px; padding:11px; background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:var(--r-sm); color:var(--text); font-family:'Fira Code',monospace; font-size:13px; line-height:1.7; resize:vertical; outline:none; transition:border-color var(--t-fast) var(--ease); min-height:160px; }
.fr-ta:focus { border-color:var(--red-glow); }
@media(max-width:600px) { .fr-ta { height:180px; } }
.fr-ntabs { display:flex; border:1px solid var(--border); border-radius:var(--r-sm); overflow:hidden; width:fit-content; margin-bottom:8px; }
.fr-ntab { padding:6px 14px; font-size:12px; font-weight:700; font-family:var(--font-body); border:none; background:rgba(255,255,255,.02); color:var(--text-muted); cursor:pointer; transition:all var(--t-fast) var(--ease); }
.fr-ntab:not(:last-child) { border-right:1px solid var(--border); }
.fr-ntab.on { background:rgba(200,16,46,.1); color:var(--text); }
.fr-nprev { min-height:180px; padding:11px; background:rgba(255,255,255,.02); border:1px solid var(--border); border-radius:var(--r-sm); display:none; overflow-y:auto; max-height:300px; }
.fr-chips { display:flex; gap:5px; flex-wrap:wrap; margin-bottom:6px; }
.fr-chip { display:inline-flex; align-items:center; gap:4px; font-size:12px; padding:3px 9px; border-radius:var(--r-pill); background:rgba(255,215,0,.07); border:1px solid rgba(255,215,0,.18); color:var(--gold); font-family:var(--font-body); }
.fr-chip button { background:none; border:none; color:var(--gold); cursor:pointer; font-size:14px; line-height:1; padding:0; opacity:.7; }
.fr-chip button:hover { color:#f07070; }
.fr-tagrow { display:flex; gap:6px; }
.fr-tagrow input { flex:1; padding:8px 11px; background:rgba(255,255,255,.03); border:1px solid var(--border); border-radius:var(--r-sm); color:var(--text); font-size:13px; font-family:var(--font-body); outline:none; }
.fr-tagrow input:focus { border-color:rgba(255,215,0,.3); }

/* FAB */
.fr-fab { position:fixed; bottom:20px; right:16px; z-index:150; display:none; }
.fr-fab button { background:var(--red); color:#fff; border:none; border-radius:var(--r-pill); padding:13px 22px; font-size:14px; font-weight:800; font-family:var(--font-display); display:flex; align-items:center; gap:8px; box-shadow:0 4px 24px var(--red-glow); cursor:pointer; transition:all var(--t-fast) var(--ease); }
.fr-fab button:hover { background:var(--red-deep); transform:translateY(-2px); }

/* Error banner */
.fr-err { background:rgba(200,16,46,.08); border:1px solid rgba(200,16,46,.25); border-radius:var(--r-sm); padding:10px 14px; font-size:13px; color:#f07070; margin-bottom:16px; font-family:var(--font-body); display:none; }

/* Loading spinner */
.fr-spinner { text-align:center; padding:40px; color:var(--text-muted); font-family:var(--font-body); }
</style>
</head>
<body>
<div class="page-enter">

<!-- NAV -->
<nav class="fr-nav" id="frNav">
  <a class="fr-brand" href="/index.html">
    <div class="fr-brand-mark"><img src="Assets/apple-touch-icon.png" alt="A"></div>
    <div class="fr-brand-text">
      <span>Astralyx</span><span>PvP</span>
      <span class="fr-brand-sub">Forums</span>
    </div>
  </a>
  <div class="fr-sp"></div>
  <a class="fr-back" href="/announcements.html">← Announcements</a>
  <div id="frAuthBtn"></div>
</nav>

<main class="fr-main">
  <div class="fr-err" id="frErr"></div>

  <!-- ── LIST VIEW ── -->
  <div class="fr-view active" id="viewList">
    <div class="fr-top">
      <h1>Community <span>Forums</span></h1>
      <button class="fb fb-outline" onclick="doLogin()" id="loginBtnList" style="display:none">
        <svg width="14" height="11" viewBox="0 0 71 55" fill="currentColor"><path d="M60.1 4.9A58.5 58.5 0 0 0 45.5.4a41 41 0 0 0-1.8 3.7 54 54 0 0 0-16.4 0A41 41 0 0 0 25.5.4 58.6 58.6 0 0 0 10.9 5C1.6 18.8-1 32.3.3 45.6a59 59 0 0 0 18 9.1 44 44 0 0 0 3.8-6.2l-.1-.1a38.6 38.6 0 0 1-6-2.9l1.5-1.1a42.1 42.1 0 0 0 36 0l1.5 1.1a38.5 38.5 0 0 1-6 2.9 43.8 43.8 0 0 0 3.8 6.2 58.7 58.7 0 0 0 18-9.1C72 30.2 68 16.9 60.1 4.9ZM23.7 37.8c-3.5 0-6.4-3.2-6.4-7.2s2.9-7.2 6.4-7.2 6.5 3.2 6.4 7.2c0 4-2.9 7.2-6.4 7.2Zm23.6 0c-3.5 0-6.4-3.2-6.4-7.2s2.9-7.2 6.4-7.2 6.5 3.2 6.4 7.2c0 4-2.9 7.2-6.4 7.2Z"/></svg>
        Join to Post
      </button>
    </div>

    <div class="fr-search-wrap">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input class="fr-search" id="frSearch" type="text" placeholder="Search threads…" oninput="onSearch()">
    </div>

    <div class="fr-cats" id="frCats"></div>

    <div class="fr-list-hdr">
      <span>Thread</span>
      <span style="text-align:center">Replies</span>
      <span style="text-align:right">Posted</span>
    </div>

    <div id="frList">
      <div class="fr-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Loading…</div>
    </div>
  </div>

  <!-- ── THREAD VIEW ── -->
  <div class="fr-view" id="viewThread">
    <div class="fr-thread-hdr">
      <div class="fr-breadcrumb">
        <a onclick="goList()"><i class="fa-solid fa-arrow-left"></i> Forums</a>
        <span>›</span>
        <span id="tBreadCat" style="color:var(--red)"></span>
        <span>›</span>
        <span id="tBreadTitle" style="color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:200px;"></span>
      </div>
      <div class="fr-thread-title-bar">
        <h2 class="fr-thread-title" id="tTitle"></h2>
      </div>
      <div class="fr-thread-badges" id="tBadges"></div>
    </div>

    <div id="tPosts"></div>

    <div id="tRepliesSection"></div>

    <div id="tReplyBox"></div>
  </div>

</main>
</div>

<!-- FAB -->
<div class="fr-fab" id="frFab">
  <button onclick="openNewThread()">
    <i class="fa-solid fa-plus"></i> New Thread
  </button>
</div>

<!-- NEW THREAD MODAL -->
<div class="fr-modal-ovl" id="frModal">
  <div class="fr-modal-box">
    <div class="fr-modal-hdr">
      <h2>New Thread</h2>
      <button class="fb fb-ghost" onclick="closeModal()">✕ Close</button>
    </div>
    <div class="fr-modal-body">
      <div>
        <label class="fr-lbl">Title <span class="req">*</span></label>
        <input class="fr-inp" id="ntTitle" type="text" placeholder="Thread title…" maxlength="200">
      </div>
      <div>
        <label class="fr-lbl">Category <span class="req">*</span></label>
        <select class="fr-select" id="ntCat">
          <option value="General">🗣️ General</option>
          <option value="Suggestions">💡 Suggestions</option>
          <option value="Bug Reports">🐛 Bug Reports</option>
          <option value="PvP Discussion">⚔️ PvP Discussion</option>
          <option value="Off Topic">🎉 Off Topic</option>
          <option value="Introductions">👋 Introductions</option>
          <option value="Announcements">📢 Announcements</option>
        </select>
      </div>
      <div>
        <label class="fr-lbl">Content <span class="req">*</span> — Markdown supported</label>
        <div class="fr-ntabs">
          <button class="fr-ntab on" onclick="ntTab('write',this)">✏️ Write</button>
          <button class="fr-ntab" onclick="ntTab('preview',this)">👁 Preview</button>
        </div>
        <textarea class="fr-ta" id="ntContent" oninput="ntPreview()"
          placeholder="Describe your thread...&#10;&#10;**Bold**, *italic*, `code`, lists, tables — all supported."></textarea>
        <div class="fr-md fr-nprev" id="ntPrev"></div>
      </div>
      <div>
        <label class="fr-lbl">Tags <span style="color:var(--text-muted);text-transform:none;font-weight:400;">— optional custom tags</span></label>
        <div class="fr-chips" id="ntChips"></div>
        <div class="fr-tagrow">
          <input type="text" id="ntTagInp" placeholder="Add a tag and press Enter…" maxlength="25"
            onkeydown="if(event.key==='Enter'||event.key===','){event.preventDefault();addNtTag()}">
          <button class="fb fb-outline" style="font-size:12px;padding:6px 12px;min-height:34px" onclick="addNtTag()">Add</button>
        </div>
        <p class="fr-hint">Players can add custom tags in addition to category.</p>
      </div>
    </div>
    <div class="fr-modal-ftr">
      <span class="fr-modal-st" id="ntSt"></span>
      <button class="fb fb-red" id="ntSubmit" onclick="submitThread()">
        <i class="fa-solid fa-paper-plane"></i> Post Thread
      </button>
    </div>
  </div>
</div>

<script>
/* ══ CONFIG ════════════════════════════════════════════════ */
const CLIENT_ID = 'YOUR_DISCORD_CLIENT_ID'; // ← replace this

const CATEGORIES = ['All','General','Suggestions','Bug Reports','PvP Discussion','Off Topic','Introductions','Announcements'];
const CAT_ICONS = { All:'🗂️', General:'🗣️', Suggestions:'💡', 'Bug Reports':'🐛', 'PvP Discussion':'⚔️', 'Off Topic':'🎉', Introductions:'👋', Announcements:'📢' };

/* ══ AUTH ══════════════════════════════════════════════════ */
let ME = null;

function initAuth() {
  const p = new URLSearchParams(location.search);
  const token = p.get('token'), err = p.get('error');
  if (token || err) history.replaceState({}, '', location.pathname);
  const errMsgs = {
    not_member: '🚫 You must be a member of the AstralyxPvP Discord server to post.',
    token_failed: '⚠️ Discord auth failed. Try again.',
    user_failed: '⚠️ Could not fetch your Discord profile.',
    no_code: '⚠️ OAuth code missing.',
    server_error: '⚠️ Server error during login.',
  };
  if (err) showErr(errMsgs[err] || `Login error: ${err}`);
  const stored = token || sessionStorage.getItem('fr_token');
  if (stored) {
    sessionStorage.setItem('fr_token', stored);
    try {
      const pl = JSON.parse(atob(stored.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
      if (pl.isMember && pl.exp > Math.floor(Date.now()/1000)) ME = { token: stored, ...pl };
      else sessionStorage.removeItem('fr_token');
    } catch { sessionStorage.removeItem('fr_token'); }
  }
  renderAuth();
}

function renderAuth() {
  const el = document.getElementById('frAuthBtn');
  const fab = document.getElementById('frFab');
  const loginBtn = document.getElementById('loginBtnList');
  if (ME) {
    el.innerHTML = `<div class="fr-user">
      <img class="fr-uav" src="${x(ME.avatar)}" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" alt="">
      <span class="fr-uname">${x(ME.username)}</span>
      ${ME.isStaff ? '<span class="fr-badge staff">Staff</span>' : '<span class="fr-badge">Member</span>'}
      <button class="fb fb-ghost" onclick="logout()" style="font-size:11px;padding:4px 9px;min-height:28px">Out</button>
    </div>`;
    fab.style.display = '';
    if (loginBtn) loginBtn.style.display = 'none';
  } else {
    el.innerHTML = `<button class="fb fb-discord" onclick="doLogin()" style="font-size:12px;padding:7px 14px;min-height:34px">
      <svg width="14" height="11" viewBox="0 0 71 55" fill="white"><path d="M60.1 4.9A58.5 58.5 0 0 0 45.5.4a41 41 0 0 0-1.8 3.7 54 54 0 0 0-16.4 0A41 41 0 0 0 25.5.4 58.6 58.6 0 0 0 10.9 5C1.6 18.8-1 32.3.3 45.6a59 59 0 0 0 18 9.1 44 44 0 0 0 3.8-6.2l-.1-.1a38.6 38.6 0 0 1-6-2.9l1.5-1.1a42.1 42.1 0 0 0 36 0l1.5 1.1a38.5 38.5 0 0 1-6 2.9 43.8 43.8 0 0 0 3.8 6.2 58.7 58.7 0 0 0 18-9.1C72 30.2 68 16.9 60.1 4.9ZM23.7 37.8c-3.5 0-6.4-3.2-6.4-7.2s2.9-7.2 6.4-7.2 6.5 3.2 6.4 7.2c0 4-2.9 7.2-6.4 7.2Zm23.6 0c-3.5 0-6.4-3.2-6.4-7.2s2.9-7.2 6.4-7.2 6.5 3.2 6.4 7.2c0 4-2.9 7.2-6.4 7.2Z"/></svg>
      Login
    </button>`;
    fab.style.display = 'none';
    if (loginBtn) loginBtn.style.display = '';
  }
}

function doLogin() {
  const state = btoa(JSON.stringify({ nonce: crypto.randomUUID(), from: 'forums' }));
  sessionStorage.setItem('fr_oauth_state', state);
  const redir = encodeURIComponent(`${location.origin}/discord-callback`);
  location.href = `https://discord.com/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${redir}&response_type=code&scope=identify+guilds.members.read&state=${encodeURIComponent(state)}`;
}

function logout() {
  sessionStorage.removeItem('fr_token'); ME = null; renderAuth();
}

/* ══ CATEGORIES ════════════════════════════════════════════ */
let activeCat = 'All', searchQ = '';

function buildCats() {
  const bar = document.getElementById('frCats');
  bar.innerHTML = CATEGORIES.map(c => `
    <button class="fr-cat ${c===activeCat?'on':''}" onclick="setCat('${c}')">
      ${CAT_ICONS[c]||'🏷️'} ${c}
    </button>`).join('');
}

function setCat(cat) {
  activeCat = cat; buildCats(); loadThreads();
}

let searchTimer;
function onSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { searchQ = document.getElementById('frSearch').value.trim(); loadThreads(); }, 350);
}

/* ══ THREAD LIST ════════════════════════════════════════════ */
let threads = [];

async function loadThreads() {
  const el = document.getElementById('frList');
  el.innerHTML = `<div class="fr-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Loading…</div>`;
  try {
    let url = '/forum-api?type=threads';
    if (activeCat !== 'All') url += `&category=${encodeURIComponent(activeCat)}`;
    if (searchQ) url += `&q=${encodeURIComponent(searchQ)}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    threads = await r.json();
    renderList();
  } catch(e) {
    el.innerHTML = `<div class="fr-state"><div class="fr-state-icon">⚠️</div><p>${x(e.message)}</p></div>`;
  }
}

function renderList() {
  const el = document.getElementById('frList');
  if (!threads.length) {
    el.innerHTML = `<div class="fr-state"><div class="fr-state-icon">📭</div><p>No threads yet. Be the first to post!</p></div>`;
    return;
  }
  el.innerHTML = threads.map(t => `
    <div class="fr-thread-row" onclick="openThread(${t.id})">
      <div class="fr-tr-main">
        <div class="fr-tr-title-row">
          ${t.pinned ? '<i class="fa-solid fa-thumbtack fr-tr-pin"></i>' : ''}
          <span class="fr-tr-title">${x(t.title)}</span>
        </div>
        <div class="fr-tr-meta">
          <img class="fr-tr-av" src="${x(t.author_avatar||'')}" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" alt="">
          <span class="fr-tr-author">${x(t.author_name)}</span>
          <span class="fr-tr-cat">${x(t.category)}</span>
          ${(t.tags||[]).map(tag=>`<span class="fr-tag">${x(tag)}</span>`).join('')}
        </div>
      </div>
      <div class="fr-tr-replies"><strong>${t.reply_count}</strong>replies</div>
      <div class="fr-tr-date">${rel(t.created_at)}</div>
    </div>`).join('');
}

/* ══ THREAD VIEW ════════════════════════════════════════════ */
let currentThread = null;

async function openThread(id) {
  showView('viewThread');
  window.scrollTo(0,0);
  document.getElementById('tPosts').innerHTML = `<div class="fr-spinner"><i class="fa-solid fa-spinner fa-spin"></i> Loading…</div>`;

  try {
    const [tRes, rRes] = await Promise.all([
      fetch(`/forum-api?type=threads&id=${id}`),
      fetch(`/forum-api?type=replies&thread=${id}`)
    ]);
    currentThread = await tRes.json();
    const replies = await rRes.json();

    document.getElementById('tTitle').textContent = currentThread.title;
    document.getElementById('tBreadCat').textContent = currentThread.category;
    document.getElementById('tBreadTitle').textContent = currentThread.title;

    const badges = [
      `<span class="fr-tr-cat">${x(currentThread.category)}</span>`,
      ...(currentThread.tags||[]).map(t=>`<span class="fr-tag">${x(t)}</span>`)
    ].join('');
    document.getElementById('tBadges').innerHTML = badges;

    // Render OP
    document.getElementById('tPosts').innerHTML = renderPost(currentThread, 0, true);

    // Render replies
    const repliesEl = document.getElementById('tRepliesSection');
    if (replies.length) {
      repliesEl.innerHTML = `
        <div class="fr-replies-hdr">${replies.length} Repl${replies.length===1?'y':'ies'}</div>
        ${replies.map((r,i)=>renderPost(r,i+1,false)).join('')}`;
    } else {
      repliesEl.innerHTML = `<div class="fr-replies-hdr">No replies yet</div>`;
    }

    // Reply box
    const rb = document.getElementById('tReplyBox');
    if (ME) {
      rb.innerHTML = `
        <div class="fr-reply-box">
          <h3>💬 Post a Reply</h3>
          <div class="fr-reply-tabs">
            <button class="fr-reply-tab on" onclick="replyTab('write',this)">✏️ Write</button>
            <button class="fr-reply-tab" onclick="replyTab('preview',this)">👁 Preview</button>
          </div>
          <textarea class="fr-reply-ta" id="replyTa" oninput="replyPreview()"
            placeholder="Write your reply... Markdown supported."></textarea>
          <div class="fr-md fr-reply-prev" id="replyPrev"></div>
          <div class="fr-reply-foot">
            <span class="fr-reply-st" id="replySt"></span>
            <button class="fb fb-red" id="replySubmitBtn" onclick="submitReply(${id})">
              <i class="fa-solid fa-paper-plane"></i> Post Reply
            </button>
          </div>
        </div>`;
    } else {
      rb.innerHTML = `<div class="fr-login-nudge">
        <a onclick="doLogin()">Login with Discord</a> to post a reply.
      </div>`;
    }
  } catch(e) {
    document.getElementById('tPosts').innerHTML = `<div class="fr-state"><div class="fr-state-icon">⚠️</div><p>${x(e.message)}</p></div>`;
  }
}

function renderPost(post, num, isOP) {
  marked.setOptions({ breaks:true, gfm:true });
  const html = DOMPurify.sanitize(marked.parse((post.content||'').replace(/\\n/g,'\n')));
  const canDelete = ME && (ME.userId === post.author_id || ME.isStaff);
  const deleteBtn = canDelete ? `<button class="fb fb-danger" onclick="deletePost(${post.id},'${isOP?'thread':'reply'}',event)"><i class="fa-solid fa-trash"></i></button>` : '';
  const numLabel = isOP ? 'OP' : `#${num}`;

  return `<div class="fr-post ${isOP?'op':''}">
    <div class="fr-post-sidebar">
      <img class="fr-post-av" src="${x(post.author_avatar||'')}" onerror="this.src='https://cdn.discordapp.com/embed/avatars/0.png'" alt="">
      <div>
        <div class="fr-post-uname">${x(post.author_name)}</div>
        ${isOP ? `<div class="fr-post-role">Author</div>` : ''}
      </div>
    </div>
    <div class="fr-post-body">
      <div class="fr-post-top">
        <span class="fr-post-num">${numLabel}</span>
        <span class="fr-post-date">${new Date((post.created_at||'')+'Z').toLocaleString([],{dateStyle:'medium',timeStyle:'short'})}</span>
        ${post.edited_at ? `<span class="fr-post-date">(edited ${rel(post.edited_at)})</span>` : ''}
        <div class="fr-post-actions">${deleteBtn}</div>
      </div>
      <div class="fr-post-content fr-md">${html}</div>
    </div>
  </div>`;
}

async function deletePost(id, type, e) {
  e.stopPropagation();
  if (!confirm('Delete this post?')) return;
  try {
    const url = type==='thread'
      ? `/forum-api?type=threads&id=${id}`
      : `/forum-api?type=replies&id=${id}`;
    const r = await fetch(url, { method:'DELETE', headers:{ Authorization:`Bearer ${ME.token}` } });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    if (type==='thread') { goList(); loadThreads(); }
    else openThread(currentThread.id);
  } catch(e) { alert(`Delete failed: ${e.message}`); }
}

/* ══ REPLY ══════════════════════════════════════════════════ */
function replyTab(tab, btn) {
  document.querySelectorAll('.fr-reply-tab').forEach(b=>b.classList.remove('on')); btn.classList.add('on');
  const ta=document.getElementById('replyTa'), pv=document.getElementById('replyPrev');
  if (tab==='preview') { ta.style.display='none'; pv.style.display='block'; replyPreview(); }
  else { ta.style.display=''; pv.style.display='none'; }
}
function replyPreview() {
  marked.setOptions({breaks:true,gfm:true});
  const pv = document.getElementById('replyPrev');
  if (pv) pv.innerHTML = DOMPurify.sanitize(marked.parse(document.getElementById('replyTa').value));
}

async function submitReply(threadId) {
  const content = document.getElementById('replyTa').value.trim();
  if (!content) return setReplySt('er','Write something first.');
  const btn = document.getElementById('replySubmitBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
  try {
    const r = await fetch(`/forum-api?type=replies&thread=${threadId}`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${ME.token}` },
      body: JSON.stringify({ content }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error);
    document.getElementById('replyTa').value = '';
    openThread(threadId);
  } catch(e) { setReplySt('er',`❌ ${e.message}`); }
  finally { btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-paper-plane"></i> Post Reply'; }
}

function setReplySt(cls,msg) {
  const s=document.getElementById('replySt');
  if(s){ s.className=`fr-reply-st ${cls}`; s.textContent=msg; }
}

/* ══ NEW THREAD MODAL ═══════════════════════════════════════ */
let ntTags = [];

function openNewThread() {
  if (!ME) { doLogin(); return; }
  document.getElementById('frModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('frModal').classList.remove('open');
  document.body.style.overflow = '';
}

function ntTab(tab, btn) {
  document.querySelectorAll('.fr-ntab').forEach(b=>b.classList.remove('on')); btn.classList.add('on');
  const ta=document.getElementById('ntContent'), pv=document.getElementById('ntPrev');
  if (tab==='preview') { ta.style.display='none'; pv.style.display='block'; ntPreview(); }
  else { ta.style.display=''; pv.style.display='none'; }
}
function ntPreview() {
  marked.setOptions({breaks:true,gfm:true});
  document.getElementById('ntPrev').innerHTML = DOMPurify.sanitize(marked.parse(document.getElementById('ntContent').value));
}
function addNtTag() {
  const inp=document.getElementById('ntTagInp'), v=inp.value.replace(/,/g,'').trim();
  if (v && !ntTags.includes(v) && ntTags.length<6) { ntTags.push(v); renderNtChips(); } inp.value='';
}
function removeNtTag(i) { ntTags.splice(i,1); renderNtChips(); }
function renderNtChips() {
  document.getElementById('ntChips').innerHTML = ntTags.map((t,i)=>
    `<span class="fr-chip">${x(t)}<button onclick="removeNtTag(${i})">×</button></span>`).join('');
}

async function submitThread() {
  const title=document.getElementById('ntTitle').value.trim();
  const content=document.getElementById('ntContent').value.trim();
  const category=document.getElementById('ntCat').value;
  if (!title) return setNtSt('er','Title is required.');
  if (!content) return setNtSt('er','Content is required.');
  const btn=document.getElementById('ntSubmit');
  btn.disabled=true; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Posting…';
  try {
    const r = await fetch('/forum-api?type=threads', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${ME.token}` },
      body: JSON.stringify({ title, content, category, tags:ntTags }),
    });
    const d=await r.json();
    if (!r.ok) throw new Error(d.error);
    // Reset form
    document.getElementById('ntTitle').value='';
    document.getElementById('ntContent').value='';
    ntTags=[]; renderNtChips();
    document.getElementById('ntSt').textContent='';
    closeModal();
    await loadThreads();
    openThread(d.id);
  } catch(e) { setNtSt('er',`❌ ${e.message}`); }
  finally { btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-paper-plane"></i> Post Thread'; }
}

function setNtSt(cls,msg) {
  const s=document.getElementById('ntSt'); s.className=`fr-modal-st ${cls}`; s.textContent=msg;
}

/* ══ NAVIGATION ═════════════════════════════════════════════ */
function showView(id) {
  document.querySelectorAll('.fr-view').forEach(v=>v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goList() { showView('viewList'); currentThread=null; }

/* ══ NAV SCROLL ═════════════════════════════════════════════ */
window.addEventListener('scroll', () => {
  document.getElementById('frNav').classList.toggle('scrolled', window.scrollY > 10);
}, { passive:true });

/* ══ UTILS ══════════════════════════════════════════════════ */
function showErr(msg) { const el=document.getElementById('frErr'); el.textContent=msg; el.style.display='block'; }
function x(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function rel(d) {
  const diff=Date.now()-new Date(d+'Z').getTime(), s=Math.floor(diff/1000);
  if(s<60) return 'just now'; const m=Math.floor(s/60); if(m<60) return `${m}m ago`;
  const h=Math.floor(m/60); if(h<24) return `${h}h ago`;
  const dy=Math.floor(h/24); if(dy<7) return `${dy}d ago`;
  return new Date(d+'Z').toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});
}

document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ══ INIT ═══════════════════════════════════════════════════ */
initAuth();
buildCats();
loadThreads();
</script>
</body>
</html>
