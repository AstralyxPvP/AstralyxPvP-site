<script>
;(function() {
  var nav = document.querySelector('nav');
  var links = document.querySelector('.nav-links');
  if (!nav || !links) return;

  /* Double-decker wrap detection */
  function checkWrap() {
    var items = links.children;
    var wrapped = false;
    var firstTop = items[0] && items[0].offsetTop;
    for (var i = 1; i < items.length; i++) {
      if (items[i].offsetTop > firstTop) { wrapped = true; break; }
    }
    nav.classList.toggle('double-decker', wrapped);
  }
  var ro = new ResizeObserver(checkWrap);
  ro.observe(links);
  checkWrap();

  /* Transparent nav at top */
  function checkScroll() {
    nav.classList.toggle('nav-top', window.scrollY < 20);
  }
  window.addEventListener('scroll', checkScroll, { passive: true });
  checkScroll();
})();
</script>
